<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Portal del cliente</title>
<link rel="manifest" href="manifest-cliente.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis servicios">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f1419;--panel:#182029;--line:#28323e;--text:#e8edf3;--muted:#8b97a5;--accent:#2f7df6;
 --green:#1f9d55;--red:#c8392f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}   /* sin esto, un botón con hidden se seguía viendo */
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:11px}
header h1{font-size:16px;margin:0;font-weight:600}
.who{font-size:12px;color:var(--muted)}
.hdlogo{height:34px;max-width:96px;background:#fff;padding:3px 5px;border-radius:7px;object-fit:contain}
.icbtn{background:none;border:1px solid var(--line);color:var(--text);font:inherit;font-size:12px;padding:6px 10px;border-radius:8px}
main{padding:14px 16px 80px;max-width:760px;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{min-width:calc(50% - 4px)}
.tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
.card.tap:active{border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.num{font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.c-programada{background:rgba(201,147,26,.18);color:#e8b84b}
.c-en_ruta{background:rgba(47,125,246,.18);color:#6fa8ff}
.c-en_servicio,.c-completada{background:rgba(31,157,85,.18);color:#4fc584}
.c-pendiente{background:rgba(210,118,42,.18);color:#e29a5c}
.c-cancelada{background:rgba(139,151,165,.18);color:var(--muted)}
.c-firmado{background:rgba(31,157,85,.18);color:#4fc584}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:700;margin-top:12px}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;padding:12px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;margin-top:6px}
textarea{min-height:80px;resize:vertical}
.c-borrador,.c-anulada{background:rgba(139,151,165,.18);color:var(--muted)}
.c-enviada{background:rgba(47,125,246,.18);color:#6fa8ff}
.c-aprobada{background:rgba(31,157,85,.18);color:#4fc584}
.c-rechazada{background:rgba(200,57,47,.18);color:#e8756b}
.c-vencida{background:rgba(210,118,42,.18);color:#e29a5c}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.tot.big{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px;color:var(--muted)}
.verTag{text-align:right;font-size:10px;color:var(--muted);margin:-4px 0 8px;opacity:.75}
.empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px}
.msg{padding:11px 13px;border-radius:9px;font-size:13px;margin-top:12px;display:none}
.msg.err{background:rgba(200,57,47,.15);color:#e8756b;display:block}
.msg.ok{background:rgba(31,157,85,.15);color:#4fc584;display:block}
.login{max-width:360px;margin:0 auto;padding:40px 4px}
.logo{font-size:25px;font-weight:700;margin-bottom:4px}
.logo span{color:var(--accent)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;font-size:14px;margin:12px 0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
/* ---- Hoja del reporte ---- */
#prBar{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line)}
#prBar button{flex:1;padding:12px;border-radius:9px;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700}
#prBar button.sec{background:transparent;border:1px solid var(--line);color:var(--text)}
#prSheet{background:#fff;padding:12px}
#prBody{font-family:Arial,Helvetica,sans-serif;font-size:9.5px;color:#000;max-width:800px;margin:0 auto}
.phead{display:flex;align-items:stretch;border:1px solid #000;margin-bottom:6px}
.pco{padding:6px 10px;font-weight:700;font-size:13px;border-right:1px solid #000;display:flex;align-items:center;justify-content:center;min-width:150px;max-width:190px}
.plogo{max-height:52px;max-width:170px}
.pti{flex:1;padding:8px 10px;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.pnum{border-left:1px solid #000;padding:6px 10px;text-align:center;min-width:130px}
.pnum .sm{font-size:8px;font-weight:700}
.pt{width:100%;border-collapse:collapse;margin-bottom:6px}
.pt td,.pt th{border:1px solid #000;padding:2.5px 5px;text-align:left;vertical-align:top}
.pt th{background:#1f6fd0;color:#fff;font-size:8.5px;font-weight:700}
.pt th.gh{text-align:center;text-transform:uppercase}
.pt td.lb{background:#eef2f7;font-weight:700;width:90px}
.pt td.v{width:44px;text-align:center;font-weight:700}
.pt td.tall{height:52px}
.pcols{column-count:3;column-gap:6px}
.pcols table{break-inside:avoid;width:100%}
.pfotos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}
.pfotos figure{margin:0;break-inside:avoid}
.pfotos img{width:100%;height:105px;object-fit:cover;border:1px solid #000;display:block}
.pfotos figcaption{font-size:7.5px;font-weight:700;text-align:center;padding:1px 0}
.pconv{font-size:7.5px;margin:-2px 0 7px;line-height:1.3}
.pfirmas{display:flex;gap:26px;margin-top:16px;text-align:center}
.pfirmas>div{flex:1}
.fbox{height:56px;border-bottom:1px solid #000;display:flex;align-items:flex-end;justify-content:center}
.fbox img{max-height:54px}
.fl{font-size:9px;font-weight:700;margin-top:3px}
.sm{font-size:8px}
@media print{
 body{background:#fff}
 #vLogin,#vMain,#vDet,#prBar{display:none!important}
 #vPrint{display:block!important}
 #prSheet{padding:0}
 @page{size:letter;margin:9mm}
}
</style>
</head>
<body>

<div id="vLogin" hidden>
 <main><div class="login">
  <div class="logo">Portal <span>del cliente</span></div>
  <p class="sub" style="margin:0 0 26px">Consulte sus servicios y sus reportes firmados.</p>
  <label>Correo<input id="em" type="email" autocomplete="username" inputmode="email"></label>
  <label>Contrase&ntilde;a<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn" id="inBtn" onclick="entrar()">Entrar</button>
  <button class="btn sec" onclick="recuperarClave()">Olvidé mi contraseña</button>
  <div id="lmsg" class="msg"></div>
 </div></main>
</div>

<div id="vMain" hidden>
 <header>
  <img id="hdLogo" class="hdlogo" hidden>
  <div style="flex:1"><h1 id="hCli">&mdash;</h1><div class="who" id="hEmp"></div></div>
  <button class="icbtn" onclick="salir()">Salir</button>
 </header>
 <main>
  <div class="verTag" id="verTag"></div>
  <button class="btn sec" id="btnInstalar" hidden style="margin:0 0 12px" onclick="instalarApp()">📲 Instalar en este celular</button>
  <div class="tabs">
   <button id="tOrd" class="on" onclick="setTab('ordenes')">Servicios</button>
   <button id="tEqu" onclick="setTab('equipos')">Mis equipos</button>
   <button id="tCon" onclick="setTab('contratos')">Contratos</button>
   <button id="tCot" onclick="setTab('cotizaciones')">Cotizaciones</button>
  </div>
  <div id="lista"></div>
 </main>
</div>

<div id="vDet" hidden>
 <header>
  <button class="icbtn" onclick="volver()">&lsaquo; Volver</button>
  <h1 id="dNum" style="flex:1;text-align:center">&mdash;</h1>
  <span style="width:62px"></span>
 </header>
 <main id="detBody"></main>
</div>

<div id="vPrint" hidden>
 <div id="prBar">
  <button class="sec" onclick="cerrarImpresion()">&lsaquo; Volver</button>
  <button onclick="imprimir()">Imprimir / Guardar PDF</button>
 </div>
 <div id="prSheet"><div id="prBody"></div></div>
</div>

<script type="module">
const V='12.19.0', B='https://www.gstatic.com/firebasejs/'+V+'/';
try{
 const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=A.initializeApp({
  apiKey:"AIzaSyBDsf7oXAlsw38mYHHCn6wVxM4JcGq-jDU",
  authDomain:"hvac360.firebaseapp.com",
  projectId:"hvac360",
  storageBucket:"hvac360.firebasestorage.app",
  messagingSenderId:"217756579102",
  appId:"1:217756579102:web:343e9b8bdf004dbac4050f"});
 window.FB=Object.assign({},Au,Fs,{auth:Au.getAuth(app),fs:Fs.getFirestore(app)});
 window.dispatchEvent(new Event('fb-ready'));

 document.getElementById('lmsg').className='msg err';

<script>
const $=i=>document.getElementById(i);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL={pendiente:'Pendiente',programada:'Programada',en_ruta:'En ruta',en_servicio:'En servicio',completada:'Completada',cancelada:'Cancelada'};
const TLBL={preventivo:'Preventivo',correctivo:'Correctivo',instalacion:'Instalaci\u00f3n',emergencia:'Emergencia'};
const ALBL={operativo:'Operativo',requiere_atencion:'Requiere atenci\u00f3n',fuera_de_servicio:'Fuera de servicio'};
const FLBL={mensual:'Mensual',bimestral:'Bimestral',trimestral:'Trimestral',semestral:'Semestral',anual:'Anual'};

const TIPOS_EQ=[['AC','Aire Central'],['AV','Ventana'],['MSPT','Mini Split Piso Techo'],['MSC','Mini Split Casette'],
 ['MSP','Mini Split Pared'],['PAQ','Paquete'],['CH','Chiller'],['ER','Equipo de Refrigeración'],
 ['MAF','Manejadora de Agua Fría'],['TE','Torre de Enfriamiento'],['BOM','Bomba']];

const CHECKS={
 'Evaporador':['Revisar aislamiento térmico','Limpieza de filtros','Sondeo drenajes','Alineación de polea',
  'Tensión de correas','Limpieza rotor','Lavado serpentín','Engrase y estado del eje','Lubricación rodamientos',
  'Ajuste bulbo válvula expansión','Revisar y limpiar ductos / rejillas'],
 'Condensador':['Limpieza rotor y eje','Lavado serpentín','Lubricación rodamientos','Revisar operación de presostatos',
  'Ajuste conexión eléctricas'],
 'Compresores':['Condiciones generales de operación','Fugas aceite / refrigerantes','Nivel y estado de aceite',
  'Presostato aceite','Presostato alta / baja','Termo sensor','Resistencia cárter','Sonido operación'],
 'Tableros':['Ajuste conexión eléctricas','Revisar mandos / indicadores'],
 'Circuito de refrigeración':['Válvula paso','Aislamiento tubería','Filtro secador','Indicador líquido','Indicador humedad'],
 'Centro de cómputo':['Calibración control temperatura','Calibración control humedad','Lavado tanque humectación',
  'Resistencia humectación','Resistencia calentamiento','Suministro agua','Alarma audio / visual',
  'Control filtros obstruidos','Control flujo aire'],
 'Gabinetes / ductos':['Limpieza exterior','Ajuste tornillos','Pintura','Limpieza rejillas']};

const DATOS={
 'Presión':['Succión compresor 1','Succión compresor 2','Descarga compresor 1','Descarga compresor 2','Aceite compresor 1','Aceite compresor 2'],
 'Temperatura':['Aire suministro o agua','Aire retorno o agua'],
 'Amperaje':['Compresor 1','Compresor 2','Motor acondicionadora','Motor condensadora 1','Motor condensadora 2','Motor condensadora 3','Motor condensadora 4','Resistencias'],
 'Voltaje':['Compresor 1','Compresor 2','Motor acondicionadora','Motor condensadora 1','Motor condensadora 2','Motor condensadora 3','Motor condensadora 4']};

const EVALS=['Calidad del trabajo','Oportunidad en la entrega','Atención de los técnicos','Presentación y orden'];
const ROLES_EQ=['Condensadora','Manejadora','Otros'];
const k=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');


const VERSION='v2026.10.12-1';
let TENANT=null, ME=null, CLIID='', EMPRESA='', LOGO='';
let ORDERS=[], EQUIPOS=[], SEDES=[], CONTRATOS=[], COTS=[], TAB='ordenes', DET=null, DETCOT=null, COTERR='';
const COT_EST={borrador:'Borrador',enviada:'Pendiente de su aprobación',aprobada:'Aprobada',rechazada:'Rechazada',vencida:'Vencida',anulada:'Anulada'};
const COT_TIPOS={repuesto:'Repuesto',obra:'Mano de obra',otro:'Otro'};
const money=n=>'$ '+Math.round(n||0).toLocaleString('es-CO');

const fdate=s=>{if(!s)return '\u2014';const[y,m,d]=String(s).split('-');return `${d}/${m}/${y}`};
function view(v){['vLogin','vMain','vDet','vPrint'].forEach(x=>$(x).hidden=(x!==v));window.scrollTo(0,0)}
function msg(id,t,cls){const e=$(id);e.textContent=t;e.className='msg'+(t?' '+cls:'')}
function errMsg(e){
 const c=(e&&e.code)||'';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Correo o contrase\u00f1a incorrectos.';
 if(c.includes('too-many-requests'))return 'Demasiados intentos. Espere un momento.';
 if(c.includes('unauthorized-domain'))return 'Este dominio no est\u00e1 autorizado en Firebase.';
 if(c.includes('permission-denied'))return 'Su usuario no tiene permiso para ver esta informaci\u00f3n.';
 return (e&&e.message)||'Error desconocido.';
}
async function entrar(){
 const e=$('em').value.trim(), p=$('pw').value;
 if(!e||!p){msg('lmsg','Escriba su correo y su contrase\u00f1a.','err');return}
 msg('lmsg','Entrando\u2026','ok'); $('inBtn').disabled=true;
 try{ await FB.signInWithEmailAndPassword(FB.auth,e,p) }
 catch(err){ msg('lmsg',errMsg(err),'err'); $('inBtn').disabled=false }
}
async function recuperarClave(){
 const e=$('em').value.trim();
 if(!e){ msg('lmsg','Escriba primero su correo arriba y vuelva a tocar el bot\u00f3n.','err'); $('em').focus(); return }
 try{
  await FB.sendPasswordResetEmail(FB.auth,e);
  msg('lmsg','Le llegar\u00e1 un correo a '+e+' para cambiar la contrase\u00f1a. Revise tambi\u00e9n el correo no deseado.','ok');
 }catch(err){ msg('lmsg',errMsg(err),'err') }
}
async function salir(){ if(!confirm('\u00bfCerrar sesi\u00f3n?'))return; await FB.signOut(FB.auth); location.reload() }

async function alEntrar(u){
 try{
  const ud=await FB.getDoc(FB.doc(FB.fs,'users',u.uid));
  if(!ud.exists()){ msg('lmsg','Su cuenta no est\u00e1 vinculada a ninguna empresa.','err'); $('inBtn').disabled=false; await FB.signOut(FB.auth); return }
  TENANT=ud.data().tenantId;
  const [md,td]=await Promise.all([
   FB.getDoc(FB.doc(FB.fs,'tenants',TENANT,'members',u.uid)),
   FB.getDoc(FB.doc(FB.fs,'tenants',TENANT))]);
  if(!md.exists()||md.data().active===false){ msg('lmsg','Su usuario est\u00e1 inactivo.','err'); $('inBtn').disabled=false; await FB.signOut(FB.auth); return }
  ME=md.data(); CLIID=ME.clientId||'';
  if(ME.role!=='cliente'||!CLIID){
   msg('lmsg','Este portal es solo para clientes. Use la direcci\u00f3n que le corresponde.','err');
   $('inBtn').disabled=false; await FB.signOut(FB.auth); return;
  }
  EMPRESA=td.exists()?(td.data().name||''):'';
  LOGO=td.exists()?(td.data().logoUrl||''):'';
  aplicarLogo();
  await cargarPlantillas();
  await cargar();
  $('hCli').textContent=ME.name||'Cliente';
  $('hEmp').textContent=EMPRESA?('Servicios prestados por '+EMPRESA):'';
  view('vMain'); pintar();
 }catch(e){ console.error(e); msg('lmsg',errMsg(e),'err'); $('inBtn').disabled=false }
}
function aplicarLogo(){
 const vt=$('verTag'); if(vt) vt.textContent='Portal del cliente · '+VERSION;
 const e=$('hdLogo'); if(e){ e.src=LOGO||''; e.hidden=!LOGO }
 if(LOGO){ ['icon','apple-touch-icon'].forEach(r=>{
   let l=document.querySelector(`link[rel="${r}"]`);
   if(!l){ l=document.createElement('link'); l.rel=r; document.head.appendChild(l) } l.href=LOGO }) }
 if(EMPRESA) document.title=EMPRESA+' \u00b7 Portal del cliente';
}
async function cargar(){
 const q=(col)=>FB.getDocs(FB.query(FB.collection(FB.fs,'tenants',TENANT,col),FB.where('clientId','==',CLIID)));
 const qCot=FB.getDocs(FB.query(FB.collection(FB.fs,'tenants',TENANT,'quotes'),
   FB.where('clientId','==',CLIID),
   FB.where('status','in',['enviada','aprobada','rechazada','vencida']))).catch(e=>{console.error('cotizaciones',e);COTERR=errMsg(e);return null});
 const [or,as,si,ct,co]=await Promise.all([q('workOrders'),q('assets'),q('sites'),q('contracts'),qCot]);
 COTS=[]; if(co) co.forEach(d=>COTS.push(Object.assign({_id:d.id},d.data())));
 COTS.sort((a,b)=>(b.seq||0)-(a.seq||0));
 ORDERS=[]; or.forEach(d=>ORDERS.push(Object.assign({_id:d.id},d.data())));
 ORDERS.sort((a,b)=>((b.scheduledDate||'')).localeCompare(a.scheduledDate||''));
 EQUIPOS=[]; as.forEach(d=>EQUIPOS.push(Object.assign({_id:d.id},d.data())));
 SEDES=[];  si.forEach(d=>SEDES.push(Object.assign({_id:d.id},d.data())));
 CONTRATOS=[]; ct.forEach(d=>CONTRATOS.push(Object.assign({_id:d.id},d.data())));
}
const sede=id=>SEDES.find(s=>s._id===id);
function setTab(t){TAB=t;$('tOrd').className=t==='ordenes'?'on':'';$('tEqu').className=t==='equipos'?'on':'';$('tCon').className=t==='contratos'?'on':'';$('tCot').className=t==='cotizaciones'?'on':'';pintar()}

function pintar(){
 const c=$('lista');
 if(TAB==='ordenes'){
  c.innerHTML=ORDERS.length?ORDERS.map(o=>`<div class="card tap" onclick="detalle('${esc(o._id)}')">
    <div class="row"><span class="num">${esc(o.number||o._id)}</span><span class="chip c-${esc(o.status)}">${esc(LBL[o.status]||o.status)}</span></div>
    <div class="sub" style="margin-top:6px;color:var(--text)">${esc(TLBL[o.type]||o.type||'')} \u00b7 ${esc(o.siteName||'')}</div>
    <div class="sub">${fdate(o.scheduledDate)}${o.assetCode?' \u00b7 '+esc(o.assetCode):''}</div>
   </div>`).join(''):'<div class="empty">Todav\u00eda no hay servicios registrados.</div>';
 } else if(TAB==='equipos'){
  c.innerHTML=EQUIPOS.length?EQUIPOS.map(a=>`<div class="card">
    <div class="row"><span class="num">${esc(a.code||a._id)}</span><span class="chip c-${a.status==='operativo'?'completada':'pendiente'}">${esc(ALBL[a.status]||a.status||'')}</span></div>
    <div class="sub" style="margin-top:6px;color:var(--text)">${esc(a.type||'')} ${esc(a.brand||'')} ${esc(a.model||'')}</div>
    <div class="sub">${esc((sede(a.siteId)||{}).name||'')}${a.location?' \u00b7 '+esc(a.location):''}</div>
    ${a.btu?`<div class="sub">${esc(a.btu)} BTU${a.refrigerant?' \u00b7 '+esc(a.refrigerant):''}</div>`:''}
   </div>`).join(''):'<div class="empty">No hay equipos registrados a su nombre.</div>';
 } else if(TAB==='cotizaciones'){
  const pend=COTS.filter(x=>x.status==='enviada').length;
  c.innerHTML=(pend?`<div class="card" style="border-color:var(--accent)"><b>${pend} cotización(es) esperan su respuesta.</b><div class="sub">Ábrala, revísela y apruébela o recházela.</div></div>`:'')
   +(COTERR?`<div class="card"><div class="sub">No se pudieron cargar las cotizaciones: ${esc(COTERR)}</div></div>`:'')
   +(COTS.length?COTS.map(x=>`<div class="card tap" onclick="detCot('${esc(x._id)}')">
    <div class="row"><span class="num">${esc(x.number||x._id)}</span><span class="chip c-${esc(x.status)}">${esc(COT_EST[x.status]||x.status)}</span></div>
    <div class="sub" style="margin-top:6px;color:var(--text)">${esc(x.title||'')}</div>

async function decidirCot(id,decision){

 if(decision==='rechazada'&&!nota){ msg('cotMsg','Escriba brevemente por qué no la aprueba.','err'); $('cotNota')&&$('cotNota').focus(); return }

   status:decision, clientNote:nota||null, decidedBy:u, decidedAt:FB.serverTimestamp(),

/* ---- De dónde salen los formatos de fábrica en el portal ---- */
const PL_FUENTE={checks:CHECKS,datos:DATOS,evals:EVALS,slug:k};
/* ================= FORMATOS DE INFORME · MOTOR COMÚN =================
   El mismo código en la oficina, en el celular del técnico y en el
   portal del cliente, para que los tres entiendan igual un formato.

   Regla de oro: cada punto de chequeo, cada dato medido y cada pregunta
   de evaluación tiene un IDENTIFICADOR FIJO. Los informes guardan sus
   respuestas contra ese identificador, no contra el texto. Así, si una
   empresa le cambia el nombre a un chequeo, los informes viejos siguen
   mostrando bien lo que se marcó.

   Los formatos de fábrica usan exactamente los mismos identificadores
   que ya tenían los informes de antes de esta función, para que ninguno
   se dañe.                                                            */

const PL_SECCIONES=[
 {id:'servicio',  nom:'Horas de entrada y salida', ayuda:'Cuándo llegó y cuándo salió el técnico'},
 {id:'equipos',   nom:'Identificación del equipo', ayuda:'Marca, modelo, serie, ubicación'},
 {id:'chequeos',  nom:'Lista de chequeo',          ayuda:'Lo que el técnico va marcando', edita:'chequeos'},
 {id:'datos',     nom:'Datos medidos',             ayuda:'Presiones, temperaturas, amperajes', edita:'datos'},
 {id:'materiales',nom:'Materiales y repuestos',    ayuda:'Lo que se consumió en el servicio'},
 {id:'actividad', nom:'Descripción de la actividad',ayuda:'Texto libre de lo que se hizo'},
 {id:'recom',     nom:'Recomendaciones del técnico',ayuda:'Texto libre'},
 {id:'observ',    nom:'Observaciones del cliente', ayuda:'Texto libre'},
 {id:'evaluacion',nom:'Evaluación del servicio',   ayuda:'El cliente califica de 1 a 5', edita:'evaluacion'},
 {id:'fotos',     nom:'Registro fotográfico',      ayuda:'Antes, durante y después'},
 {id:'firmas',    nom:'Firmas',                    ayuda:'Cliente y técnico. Siempre va de último'}
];
const PL_ROLES=['Condensadora','Manejadora','Otros'];
const PL_SERVICIOS=[['preventivo','Preventivo'],['correctivo','Correctivo'],
                    ['instalacion','Instalación'],['emergencia','Emergencia']];
const plSecDe=id=>PL_SECCIONES.find(s=>s.id===id)||{id,nom:id,ayuda:''};
const plNuevoId=p=>p+'_x'+Math.random().toString(36).slice(2,8);

/* ---- Los dos formatos de fábrica, armados desde las listas de siempre ---- */
function plFabrica(servicio){
 const F=PL_FUENTE, sl=F.slug;
 const prev=servicio==='preventivo';
 const apagadas=prev?['materiales','actividad']:['chequeos'];
 return {
  id:'base-'+servicio,
  nombre:prev?'Preventivo (de fábrica)':'Correctivo (de fábrica)',
  titulo:'REPORTE DE MANTENIMIENTO '+(prev?'PREVENTIVO':'CORRECTIVO'),
  servicio, equipo:'', activo:true, base:true,
  secciones:PL_SECCIONES.map(s=>({id:s.id,on:!apagadas.includes(s.id)})),
  chequeos:Object.entries(F.checks).map(([g,items])=>({
    id:'g_'+sl(g), g, items:items.map(it=>({id:'c_'+sl(g)+'_'+sl(it),t:it}))})),
  datos:Object.entries(F.datos).map(([g,items])=>({
    id:'g_'+sl(g), g, items:items.map(it=>({id:'d_'+sl(g)+'_'+sl(it),t:it}))})),
  evaluacion:F.evals.map(e=>({id:'e_'+sl(e),t:e}))
 };
}
const plBases=()=>[plFabrica('preventivo'),plFabrica('correctivo')];

/* ---- Cuál formato le toca a una orden ----
   Manda el que coincida en servicio Y tipo de equipo. Si no hay uno
   específico para ese equipo, el del servicio. Si tampoco, el de
   fábrica. El técnico solo escoge cuando hay empate.                 */
function plCandidatas(lista,servicio,equipo){
 const act=(lista||[]).filter(p=>p.activo!==false&&p.servicio===servicio);
 if(equipo){
  const exactas=act.filter(p=>p.equipo&&p.equipo===equipo);
  if(exactas.length) return exactas;
 }
 //  Primero los generales, y los de fábrica de último: si la empresa
 //  armó uno propio, ese es el que manda.
 return act.slice().sort((a,b)=>((a.base?1:0)-(b.base?1:0))||((a.equipo?1:0)-(b.equipo?1:0)));
}
function plEscoger(lista,servicio,equipo){
 const c=plCandidatas(lista,servicio,equipo);
 if(c.length) return c[0];
 return plFabrica(servicio==='correctivo'?'correctivo':'preventivo');
}
/* ---- Lo que el técnico puede escoger ----
   Si la empresa armó formatos propios, esos son los únicos que se le
   ofrecen: para eso los armó. Si no armó ninguno, el de fábrica.    */
function plOpciones(lista,servicio,equipo){
 const c=plCandidatas(lista,servicio,equipo);
 return c.length?c:[plFabrica(servicio==='correctivo'?'correctivo':'preventivo')];
}
function plPorId(lista,id,servicio){
 const f=(lista||[]).find(p=>p.id===id);
 if(f) return f;
 if(id&&/^base-/.test(id)) return plFabrica(id.replace('base-',''));
 return plFabrica(servicio==='correctivo'?'correctivo':'preventivo');
}

const plOrden=pl=>(pl.secciones||[]).filter(s=>s.on).map(s=>s.id);

const dnPlantilla=(id,d)=>({id,
 nombre:d.nombre||'', titulo:d.titulo||'', servicio:d.servicio||'preventivo',

const upPlantilla=p=>({nombre:p.nombre,titulo:p.titulo,servicio:p.servicio,

     <div><div class="fbox">${R.firmaCliente?`<img src="${R.firmaCliente}">`:''}</div>
      <div class="fl">FIRMA DEL CLIENTE</div><div class="sm">${v(R.firmaClienteNombre)}</div></div>
     <div><div class="fbox">${R.firmaTecnico?`<img src="${R.firmaTecnico}">`:''}</div>
      <div class="fl">FIRMA DEL TÉCNICO</div><div class="sm">${v(R.firmaTecnicoNombre)}</div></div>
    </div>`;
 }
 return '';
}

/* ---- La lista completa: los dos de fábrica y los que armó la empresa ----
   Los de fábrica NO se guardan en la base de datos: se generan aquí. Así
   una empresa recién creada ya tiene formatos el primer día, sin que nadie
   le siembre nada, y nadie puede dañarlos.                              */
const plTodas=lista=>plBases().concat(lista||[]);

/* ---- Duplicar: la única forma de modificar un formato de fábrica ---- */
function plDup(origen,nuevoId){
 const c=JSON.parse(JSON.stringify(origen));
 c.id=nuevoId; c.base=false; c.activo=true;
 c.nombre=(origen.nombre||'Formato').replace(/ \(de fábrica\)$/,'')+' (copia)';
 return c;
}
function plNueva(nuevoId,servicio){
 const f=plFabrica(servicio||'preventivo');
 f.id=nuevoId; f.base=false; f.nombre='Formato nuevo'; f.activo=true;
 return f;
}

/* ---- Antes de guardar: fuera los renglones vacíos ---- */
function plLimpia(p){
 const lim=L=>(L||[]).map(g=>({id:g.id,g:(g.g||'').trim(),
    items:(g.items||[]).filter(i=>(i.t||'').trim()).map(i=>({id:i.id,t:i.t.trim()}))}))
   .filter(g=>g.g&&g.items.length);
 p.nombre=(p.nombre||'').trim(); p.titulo=(p.titulo||'').trim();
 p.chequeos=lim(p.chequeos); p.datos=lim(p.datos);
 p.evaluacion=(p.evaluacion||[]).filter(e=>(e.t||'').trim()).map(e=>({id:e.id,t:e.t.trim()}));
 //  Si una sección se quedó sin nada que mostrar, se apaga: una hoja con
 //  un título y un cuadro en blanco se ve peor que no tenerlo.
 const vacia={chequeos:!p.chequeos.length,datos:!p.datos.length,evaluacion:!p.evaluacion.length};
 p.secciones=(p.secciones||[]).map(s=>({id:s.id,on:vacia[s.id]?false:s.on!==false}));
 return p;
}
function plFalla(p){
 if((p.nombre||'').trim().length<2) return 'Póngale un nombre al formato (al menos 2 letras).';
 if((p.titulo||'').trim().length<3) return 'Escriba el título que sale impreso en la hoja.';
 if(!(p.secciones||[]).some(s=>s.on)) return 'Prenda al menos una sección.';
 return '';
}

 const R={tipo:pl.servicio,horaEntrada:'08:30',horaSalida:'10:15',

  checks:{},datos:{},evaluacion:{},
  materiales:[{descripcion:'Filtro lavable',unidad:'Und',cantidad:'1'}],
  actividad:'Aquí sale lo que el técnico escriba de la actividad realizada.',
  recomendaciones:'Aquí salen las recomendaciones del técnico.',
  observaciones:'Aquí salen las observaciones del cliente.',
  firmaClienteNombre:'Nombre de quien recibe', firmaTecnicoNombre:'Nombre del técnico'};
 (pl.chequeos||[]).forEach((g,gi)=>g.items.forEach((it,ii)=>{ if((gi+ii)%2===0) R.checks[it.id]=true }));
 (pl.datos||[]).forEach(g=>g.items.forEach((it,ii)=>{ R.datos[it.id]=String(12+ii*3) }));

/* ================= EL FORMATO EN EL PORTAL DEL CLIENTE =================
   El cliente ve la hoja armada con el mismo formato con el que se llenó
   el informe, y con el mismo código que la arma en la oficina.       */
let PLANTILLAS=[];
async function cargarPlantillas(){
 try{
  const snap=await FB.getDocs(FB.collection(FB.fs,'tenants',TENANT,'reportTemplates'));
  PLANTILLAS=[]; snap.forEach(d=>PLANTILLAS.push(dnPlantilla(d.id,d.data())));
 }catch(e){ PLANTILLAS=[] }
}
function verHoja(){
 const o=DET, R=window.__REP; if(!o||!R) return;
 const pl=plPorId(PLANTILLAS,R.plantilla,R.tipo);
 $('prBody').innerHTML=plHoja({
  pl, R, esc, fdate,
  logo:LOGO||'', empresa:EMPRESA||'',
  numero:o.number||'', cliente:o.clientName||'', fecha:o.scheduledDate,
  sede:o.siteName||'', equipo:o.assetCode||'',
  tipos:TIPOS_EQ.map(t=>t[0]+': '+t[1]).join(' · '),
  fotosHtml:fotosHoja(window.__FOTOS)});
 view('vPrint');
}

function arrancar(){
 FB.onAuthStateChanged(FB.auth,u=>{
  if(u) alEntrar(u);
  else { TENANT=null;ME=null;ORDERS=[];EQUIPOS=[];SEDES=[];CONTRATOS=[];COTS=[]; $('inBtn').disabled=false; view('vLogin') }
 });
}

/* ================= INSTALAR EN EL CELULAR =================
   Hace que la página se pueda guardar como una app de verdad: ícono en
   la pantalla de inicio, pantalla completa sin barra del navegador, y
   que abra aunque no haya señal. Los datos siguen viniendo de Firebase
   cuando hay internet.                                                */
let promesaInstalar=null;
const yaInstalada=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const esIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;

function verBotonInstalar(mostrar){
 const b=document.getElementById('btnInstalar');
 if(b) b.hidden=!mostrar;
}
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault(); promesaInstalar=e; verBotonInstalar(true);
});
window.addEventListener('appinstalled',()=>{
 promesaInstalar=null; verBotonInstalar(false);
});
async function instalarApp(){
 if(promesaInstalar){
  promesaInstalar.prompt();
  try{ await promesaInstalar.userChoice }catch(e){}
  promesaInstalar=null; verBotonInstalar(false);
  return;
 }
 if(esIOS()){
  alert('Para instalarla en un iPhone:\n\n1. Toque el botón Compartir (el cuadrito con la flecha hacia arriba).\n2. Baje y toque «Agregar a la pantalla de inicio».\n3. Toque «Agregar».\n\nLe queda el ícono junto a sus otras aplicaciones.');
  return;
 }
 alert('Para instalarla:\n\n1. Abra el menú del navegador (los tres puntos).\n2. Toque «Instalar aplicación» o «Agregar a la pantalla de inicio».\n\nSi no le aparece la opción, asegúrese de estar entrando por la dirección de internet (https) y no por un archivo guardado.');
}
function prepararInstalacion(){
 if(yaInstalada()){ verBotonInstalar(false); return }
 if(esIOS()) verBotonInstalar(true);          // iPhone no avisa solo: el botón explica cómo
 const seguro=location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
 if('serviceWorker' in navigator && seguro){
  navigator.serviceWorker.register('sw.js').catch(e=>console.log('No se pudo preparar el modo sin señal:',e.message));
 }
}
window.addEventListener('load',prepararInstalacion);

if(window.FB) arrancar(); else window.addEventListener('fb-ready',arrancar);
</script>
