<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>HVAC 360° · Técnico</title>
<link rel="manifest" href="manifest-tecnico.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HVAC Técnico">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f1419;--panel:#182029;--line:#28323e;--text:#e8edf3;--muted:#8b97a5;--accent:#2f7df6;
 --green:#1f9d55;--yellow:#c9931a;--orange:#d2762a;--red:#c8392f;--blue:#2f7df6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}   /* sin esto, un botón con hidden se seguía viendo */
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1;font-weight:600}
header .who{font-size:12px;color:var(--muted)}
.icbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
main{padding:14px 16px 90px;max-width:620px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
.card.tap:active{border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.num{font-weight:700;font-size:15px}
.cli{font-size:15px;margin:6px 0 2px}
.sub{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.c-programada{background:rgba(201,147,26,.18);color:#e8b84b}
.c-en_ruta{background:rgba(47,125,246,.18);color:#6fa8ff}
.c-en_servicio{background:rgba(31,157,85,.18);color:#4fc584}
.c-completada{background:rgba(31,157,85,.18);color:#4fc584}
.c-pendiente{background:rgba(210,118,42,.18);color:#e29a5c}
.c-cancelada{background:rgba(139,151,165,.18);color:var(--muted)}
.c-alta,.c-critica{background:rgba(200,57,47,.18);color:#e8756b}
.c-hoy{background:rgba(47,125,246,.18);color:#6fa8ff}
.c-vencida{background:rgba(200,57,47,.2);color:#e8756b}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:11px;background:var(--accent);color:#fff;
 font:inherit;font-size:16px;font-weight:700;margin-top:12px}
.btn:disabled{opacity:.5}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;padding:12px}
.btn.warn{background:transparent;border:1px solid var(--red);color:#e8756b;font-weight:600;font-size:14px;padding:12px}
.dosbtn{display:flex;gap:8px}
.dosbtn .btn{margin-top:10px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;margin-top:6px}
.c-aprobado{background:rgba(31,157,85,.18);color:#4fc584}
.c-rechazado{background:rgba(200,57,47,.18);color:#e8756b}
.saldo{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.saldo:last-child{border-bottom:none}
.saldo b{font-size:15px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:12px 0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
.empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px}
.msg{padding:11px 13px;border-radius:9px;font-size:13px;margin-top:12px;display:none}
.msg.err{background:rgba(200,57,47,.15);color:#e8756b;display:block}
.msg.ok{background:rgba(31,157,85,.15);color:#4fc584;display:block}
.login{max-width:360px;margin:0 auto;padding:40px 4px}
.logo{font-size:26px;font-weight:700;margin-bottom:4px}
.logo span{color:var(--accent)}
.hist{border-left:2px solid var(--line);padding-left:12px;margin-top:6px}
.hist div{font-size:13px;color:var(--muted);margin-bottom:7px}
.hdlogo{height:34px;max-width:96px;background:#fff;padding:3px 5px;border-radius:7px;object-fit:contain}
.off{background:var(--orange);color:#fff;text-align:center;font-size:12px;padding:5px;font-weight:600}
.secTit{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 9px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 64px 64px;gap:7px;margin-bottom:7px}
.g3 input{margin-top:0}
.ck{display:flex;align-items:center;gap:10px;font-weight:400;color:var(--text);font-size:14px;margin-bottom:9px}
.ck input{width:21px;height:21px;margin:0;flex:none;accent-color:var(--accent)}
.stars{display:flex;gap:7px}
.st{flex:1;padding:10px 0;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font:inherit;font-weight:700}
.st.on{background:var(--accent);border-color:var(--accent);color:#fff}
.verTag{text-align:right;font-size:10px;color:var(--muted);margin:-6px 0 8px;opacity:.75}
.autoE{font-size:12px;text-align:center;padding:6px 12px;color:var(--muted);min-height:28px}
.autoE.pend{background:rgba(210,118,42,.14);color:#e29a5c}
.autoE.ok{background:rgba(31,157,85,.13);color:#4fc584}
.autoE.err{background:rgba(200,57,47,.15);color:#e8756b}
.fotoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.fotoBox{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#000}
.fotoBox img{width:100%;height:100%;object-fit:cover;display:block}
.fotoX{position:absolute;top:4px;right:4px;width:26px;height:26px;border:none;border-radius:50%;
 background:rgba(0,0,0,.65);color:#fff;font:inherit;font-size:13px;line-height:1;padding:0}
#vLupa{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;padding:14px}
#vLupa[hidden]{display:none!important}
#vLupa img{max-width:100%;max-height:86vh;border-radius:8px}
#vLupa button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;background:rgba(255,255,255,.14);
 border:none;color:#fff;font:inherit;padding:9px 15px;border-radius:9px}
.pfotos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}
.pfotos figure{margin:0;break-inside:avoid}
.pfotos img{width:100%;height:105px;object-fit:cover;border:1px solid #000;display:block}
.pfotos figcaption{font-size:7.5px;font-weight:700;text-align:center;padding:1px 0}
.firmaVacia{height:78px;border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
#vFirma{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px 16px}
#vFirma[hidden]{display:none!important}
.fmTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fmTop span{font-size:16px;font-weight:700}
.fmCv{flex:1;width:100%;background:#fff;border-radius:12px;touch-action:none;display:block}
.fmHint{text-align:center;font-size:12px;color:var(--muted);margin:9px 0}
.fmBtns{display:flex;gap:10px}
.fmBtns .btn{margin-top:0}
.firmaImg{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;display:block}
/* ---- Hoja para imprimir o guardar como PDF ---- */
#prSheet{background:#fff;color:#000;padding:12px}
#prBody{font-family:Arial,Helvetica,sans-serif;font-size:9.5px;color:#000;max-width:800px;margin:0 auto}
.phead{display:flex;align-items:stretch;border:1px solid #000;margin-bottom:6px}
.pco{padding:6px 10px;font-weight:700;font-size:13px;border-right:1px solid #000;display:flex;align-items:center;justify-content:center;min-width:150px;max-width:190px}
.plogo{max-height:52px;max-width:170px}
.pti{flex:1;padding:8px 10px;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.pnum{border-left:1px solid #000;padding:6px 10px;text-align:center;min-width:130px}
.pnum .sm{font-size:8px;font-weight:700}
.pt{width:100%;border-collapse:collapse;margin-bottom:6px}
.pt td,.pt th{border:1px solid #000;padding:2.5px 5px;text-align:left;vertical-align:top}
.pt th{background:#1f6fd0;color:#fff;font-size:8.5px;font-weight:700}
.pt th.gh{background:#1f6fd0;text-align:center;text-transform:uppercase}
.pt td.lb{background:#eef2f7;font-weight:700;width:90px}
.pt td.v{width:44px;text-align:center;font-weight:700}
.pt td.tall{height:52px}
.pcols{column-count:3;column-gap:6px}
.pcols table{break-inside:avoid;width:100%}
.pconv{font-size:7.5px;margin:-2px 0 7px;line-height:1.3}
.pfirmas{display:flex;gap:26px;margin-top:16px;text-align:center}
.pfirmas>div{flex:1}
.fbox{height:56px;border-bottom:1px solid #000;display:flex;align-items:flex-end;justify-content:center}
.fbox img{max-height:54px}
.fl{font-size:9px;font-weight:700;margin-top:3px}
.sm{font-size:8px}
.prbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.prbar button{flex:1;padding:12px;border-radius:9px;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.prbar button.sec{background:transparent;border:1px solid var(--line);color:var(--text)}
@media print{
 body{background:#fff}
 #vLogin,#vList,#vDet,#vRep,#offline,.prbar{display:none!important}
 #vPrint{display:block!important}
 #prSheet{padding:0}
 @page{size:letter;margin:9mm}
}
</style>
</head>
<body>

<div id="offline" class="off" hidden>Sin conexión — sus cambios se guardan y se envían al volver la señal</div>

<div id="vLogin" hidden>
 <main><div class="login">
  <div class="logo">HVAC <span>360°</span></div>
  <p class="sub" style="margin:0 0 26px">App del técnico</p>
  <label>Correo<input id="em" type="email" autocomplete="username" inputmode="email" placeholder="usted@empresa.com"></label>
  <label>Contraseña<input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
  <button class="btn" id="inBtn" onclick="entrar()">Entrar</button>
  <button class="btn sec" onclick="recuperarClave()">Olvidé mi contraseña</button>
  <div id="lmsg" class="msg"></div>
 </div></main>
</div>

<div id="vList" hidden>
 <header>
  <img id="hdLogo" class="hdlogo" hidden>
  <div style="flex:1"><h1 id="hName">—</h1><div class="who" id="hCo"></div></div>
  <button class="icbtn" onclick="salir()">Salir</button>
 </header>
 <main>
  <div class="verTag" id="verTag"></div>
  <div class="tabs">
   <button id="tHoy" class="on" onclick="setTab('hoy')">Hoy</button>
   <button id="tAbi" onclick="setTab('abiertas')">Abiertas</button>
   <button id="tTod" onclick="setTab('todas')">Todas</button>
  </div>
  <button class="btn sec" id="btnInstalar" hidden style="margin:0 0 10px" onclick="instalarApp()">📲 Instalar la app en este celular</button>
  <button class="btn sec" style="margin:0 0 14px" onclick="abrirGastos()">💸 Mis gastos y anticipos</button>
  <div id="list"></div>
 </main>
</div>

<div id="vGastos" hidden>
 <header>
  <button class="icbtn" onclick="view('vList')">‹ Volver</button>
  <h1 style="flex:1;text-align:center">Mis gastos</h1>
  <span style="width:62px"></span>
 </header>
 <main>
  <div class="card" id="gSaldos"></div>
  <button class="btn" onclick="nuevoGasto()">＋ Registrar un gasto</button>
  <div id="gLista" style="margin-top:14px"></div>
 </main>
</div>

<div id="vGForm" hidden>
 <header>
  <button class="icbtn" onclick="abrirGastos()">‹ Volver</button>
  <h1 style="flex:1;text-align:center">Nuevo gasto</h1>
  <span style="width:62px"></span>
 </header>
 <main>
  <label>Fecha<input id="gxFecha" type="date"></label>
  <label>¿En qué lo gastó?<select id="gxCat"></select></label>
  <label>Detalle<input id="gxConc" maxlength="200" placeholder="Ej. Tanqueada para ir a Soledad"></label>
  <label>Valor<input id="gxVal" type="number" inputmode="numeric" min="1" step="1000" placeholder="0"></label>
  <label>¿Con qué plata pagó?<select id="gxFuente"></select></label>
  <label>¿Fue para alguna orden?<select id="gxOrden"></select></label>
  <label>Dónde lo compró<input id="gxProv" maxlength="120" placeholder="Ej. Terpel, Homecenter"></label>
  <label>Número del recibo<input id="gxSop" maxlength="60" placeholder="Opcional"></label>
  <label>Foto del recibo
   <input type="file" id="gxCam" accept="image/*" capture="environment" hidden onchange="tomarRecibo(this)">
   <input type="file" id="gxGal" accept="image/*" hidden onchange="tomarRecibo(this)">
   <div class="dosbtn">
    <button class="btn sec" onclick="document.getElementById('gxCam').click()">📷 Tomar foto</button>
    <button class="btn sec" onclick="document.getElementById('gxGal').click()">🖼️ De la galería</button>
   </div></label>
  <div id="gxPrev"></div>
  <div id="gxMsg" class="msg"></div>
  <button class="btn" id="gxBtn" onclick="guardarMiGasto()">Enviar a la oficina</button>
  <button class="btn sec" onclick="abrirGastos()">Cancelar</button>
 </main>
</div>

<div id="vDet" hidden>
 <header>
  <button class="icbtn" onclick="volver()">‹ Volver</button>
  <h1 id="dNum" style="text-align:center">—</h1>
  <span style="width:62px"></span>
 </header>
 <main id="detBody"></main>
</div>

<div id="vRep" hidden>
 <header>
  <button class="icbtn" onclick="cerrarReporte()">‹ Volver</button>
  <img id="repLogo" class="hdlogo" hidden>
  <h1 id="repTit" style="text-align:center;font-size:14px;flex:1">Reporte</h1>
  <span style="width:62px"></span>
 </header>
 <div id="autoEstado" class="autoE"></div>
 <main id="repBody"></main>
</div>

<div id="vLupa" hidden onclick="cerrarLupa()">
 <button onclick="cerrarLupa()">Cerrar</button>
 <img id="lbImg" alt="">
</div>

<div id="vFirma" hidden>
 <div class="fmTop">
  <span id="fmTit">Firma</span>
  <button class="icbtn" onclick="cerrarFirma()">Cancelar</button>
 </div>
 <canvas id="fmCv" class="fmCv"></canvas>
 <div class="fmHint">Firme con el dedo dentro del recuadro blanco</div>
 <div class="fmBtns">
  <button class="btn sec" onclick="borrarFirma()">Borrar</button>
  <button class="btn" onclick="guardarFirma()">Listo</button>
 </div>
</div>

<div id="vPrint" hidden>
 <div class="prbar">
  <button class="sec" onclick="cerrarImpresion()">‹ Volver</button>
  <button onclick="imprimir()">Imprimir / Guardar PDF</button>
 </div>
 <div id="prSheet"><div id="prBody"></div></div>
</div>

<script type="module">
const V='12.19.0', B='https://www.gstatic.com/firebasejs/'+V+'/';
try{
 const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=A.initializeApp({
  apiKey:"AIzaSyBDsf7oXAlsw38mYHHCn6wVxM4JcGq-jDU",
  authDomain:"hvac360.firebaseapp.com",
  projectId:"hvac360",
  storageBucket:"hvac360.firebasestorage.app",
  messagingSenderId:"217756579102",
  appId:"1:217756579102:web:343e9b8bdf004dbac4050f"});
 let fs;
 try{ fs=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({})}) }
 catch(e){ fs=Fs.getFirestore(app) }
 window.FB=Object.assign({},Au,Fs,{auth:Au.getAuth(app),fs});
 window.dispatchEvent(new Event('fb-ready'));
}catch(e){
 document.getElementById('lmsg').className='msg err';
 document.getElementById('lmsg').textContent='No se pudo cargar Firebase: '+e.message;
 document.getElementById('vLogin').hidden=false;
}
</script>

<script>
const $=i=>document.getElementById(i);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL={pendiente:'Pendiente',programada:'Programada',en_ruta:'En ruta',en_servicio:'En servicio',completada:'Completada',cancelada:'Cancelada'};
const TLBL={preventivo:'Preventivo',correctivo:'Correctivo',instalacion:'Instalación',emergencia:'Emergencia'};
const PLBL={normal:'Normal',media:'Media',alta:'Alta',critica:'Crítica'};
const NEXT={programada:'en_ruta',en_ruta:'en_servicio',en_servicio:'completada'};
const NEXTL={en_ruta:'Salgo para allá',en_servicio:'Llegué, inicio servicio',completada:'Terminé el servicio'};

const VERSION='v2026.10.12-3';
let TENANT=null, ME=null, ORDERS=[], TAB='hoy', DET=null, unsub=null, EMPRESA='', LOGO='';
let BODEGAS=[], REPUESTOS=[], EXIST={};
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
function view(v){['vLogin','vList','vDet','vRep','vPrint','vFirma','vGastos','vGForm'].forEach(x=>$(x).hidden=(x!==v));window.scrollTo(0,0)}
function msg(el,t,cls){const e=$(el);e.textContent=t;e.className='msg'+(t?' '+cls:'')}

function errMsg(e){
 const c=(e&&e.code)||'';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Correo o contraseña incorrectos.';
 if(c.includes('too-many-requests'))return 'Demasiados intentos. Espere un momento.';
 if(c.includes('unauthorized-domain'))return 'Este dominio no está autorizado en Firebase.';
 if(c.includes('permission-denied'))return 'No tiene permiso. Pídale al administrador que revise su acceso.';
 if(c.includes('unavailable'))return 'Sin conexión con el servidor.';
 return (e&&e.message)||'Error desconocido.';
}
async function entrar(){
 const e=$('em').value.trim(), p=$('pw').value;
 if(!e||!p){msg('lmsg','Escriba su correo y su contraseña.','err');return}
 msg('lmsg','Entrando…','ok'); $('inBtn').disabled=true;
 try{ await FB.signInWithEmailAndPassword(FB.auth,e,p) }
 catch(err){ msg('lmsg',errMsg(err),'err'); $('inBtn').disabled=false }
}
async function recuperarClave(){
 const e=$('em').value.trim();
 if(!e){ msg('lmsg','Escriba primero su correo arriba y vuelva a tocar el botón.','err'); $('em').focus(); return }
 try{
  await FB.sendPasswordResetEmail(FB.auth,e);
  msg('lmsg','Le llegará un correo a '+e+' para cambiar la contraseña. Revise también el correo no deseado.','ok');
 }catch(err){ msg('lmsg',errMsg(err),'err') }
}
async function salir(){ if(!confirm('¿Cerrar sesión?'))return; if(unsub)unsub(); await FB.signOut(FB.auth); location.reload() }

async function alEntrar(u){
 try{
  const ud=await FB.getDoc(FB.doc(FB.fs,'users',u.uid));
  if(!ud.exists()){msg('lmsg','Su cuenta no está vinculada a ninguna empresa.','err');$('inBtn').disabled=false;await FB.signOut(FB.auth);return}
  TENANT=ud.data().tenantId;
  const [md,td]=await Promise.all([
   FB.getDoc(FB.doc(FB.fs,'tenants',TENANT,'members',u.uid)),
   FB.getDoc(FB.doc(FB.fs,'tenants',TENANT))]);
  EMPRESA=td.exists()?(td.data().name||''):'';
  LOGO=td.exists()?(td.data().logoUrl||''):'';
  aplicarLogo();
  if(!md.exists()||md.data().active===false){msg('lmsg','Su usuario está inactivo.','err');$('inBtn').disabled=false;await FB.signOut(FB.auth);return}
  ME=md.data();
  $('hName').textContent=ME.name||'Técnico';
  $('hCo').textContent=(ME.role==='tecnico')?'Sus órdenes de trabajo':'Vista de técnico · rol '+ME.role;
  cargarInventario();
  await cargarPlantillas();
  escuchar(u.uid);
  view('vList');
 }catch(e){ msg('lmsg',errMsg(e),'err'); $('inBtn').disabled=false }
}
async function cargarInventario(){
 try{
  const [wh,pa]=await Promise.all([

function ubicacion(){
 return new Promise(res=>{
  if(!navigator.geolocation) return res({lat:null,lng:null});
  const t=setTimeout(()=>res({lat:null,lng:null}),6000);
  navigator.geolocation.getCurrentPosition(
   p=>{clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude})},
   ()=>{clearTimeout(t);res({lat:null,lng:null})},{timeout:5500,maximumAge:60000});
 });
}

/* ---- De dónde salen los formatos de fábrica en el celular ---- */
const PL_FUENTE={checks:CHECKS,datos:DATOS,evals:EVALS,slug:k};
/* ================= FORMATOS DE INFORME · MOTOR COMÚN =================
   El mismo código en la oficina, en el celular del técnico y en el
   portal del cliente, para que los tres entiendan igual un formato.

   Regla de oro: cada punto de chequeo, cada dato medido y cada pregunta
   de evaluación tiene un IDENTIFICADOR FIJO. Los informes guardan sus
   respuestas contra ese identificador, no contra el texto. Así, si una
   empresa le cambia el nombre a un chequeo, los informes viejos siguen
   mostrando bien lo que se marcó.

   Los formatos de fábrica usan exactamente los mismos identificadores
   que ya tenían los informes de antes de esta función, para que ninguno
   se dañe.                                                            */

const PL_SECCIONES=[
 {id:'servicio',  nom:'Horas de entrada y salida', ayuda:'Cuándo llegó y cuándo salió el técnico'},
 {id:'equipos',   nom:'Identificación del equipo', ayuda:'Marca, modelo, serie, ubicación'},
 {id:'chequeos',  nom:'Lista de chequeo',          ayuda:'Lo que el técnico va marcando', edita:'chequeos'},
 {id:'datos',     nom:'Datos medidos',             ayuda:'Presiones, temperaturas, amperajes', edita:'datos'},
 {id:'materiales',nom:'Materiales y repuestos',    ayuda:'Lo que se consumió en el servicio'},
 {id:'actividad', nom:'Descripción de la actividad',ayuda:'Texto libre de lo que se hizo'},
 {id:'recom',     nom:'Recomendaciones del técnico',ayuda:'Texto libre'},
 {id:'observ',    nom:'Observaciones del cliente', ayuda:'Texto libre'},
 {id:'evaluacion',nom:'Evaluación del servicio',   ayuda:'El cliente califica de 1 a 5', edita:'evaluacion'},
 {id:'fotos',     nom:'Registro fotográfico',      ayuda:'Antes, durante y después'},
 {id:'firmas',    nom:'Firmas',                    ayuda:'Cliente y técnico. Siempre va de último'}
];
const PL_ROLES=['Condensadora','Manejadora','Otros'];
const PL_SERVICIOS=[['preventivo','Preventivo'],['correctivo','Correctivo'],
                    ['instalacion','Instalación'],['emergencia','Emergencia']];
const plSecDe=id=>PL_SECCIONES.find(s=>s.id===id)||{id,nom:id,ayuda:''};
const plNuevoId=p=>p+'_x'+Math.random().toString(36).slice(2,8);

/* ---- Los dos formatos de fábrica, armados desde las listas de siempre ---- */
function plFabrica(servicio){
 const F=PL_FUENTE, sl=F.slug;
 const prev=servicio==='preventivo';
 const apagadas=prev?['materiales','actividad']:['chequeos'];
 return {
  id:'base-'+servicio,
  nombre:prev?'Preventivo (de fábrica)':'Correctivo (de fábrica)',
  titulo:'REPORTE DE MANTENIMIENTO '+(prev?'PREVENTIVO':'CORRECTIVO'),
  servicio, equipo:'', activo:true, base:true,
  secciones:PL_SECCIONES.map(s=>({id:s.id,on:!apagadas.includes(s.id)})),
  chequeos:Object.entries(F.checks).map(([g,items])=>({
    id:'g_'+sl(g), g, items:items.map(it=>({id:'c_'+sl(g)+'_'+sl(it),t:it}))})),
  datos:Object.entries(F.datos).map(([g,items])=>({
    id:'g_'+sl(g), g, items:items.map(it=>({id:'d_'+sl(g)+'_'+sl(it),t:it}))})),
  evaluacion:F.evals.map(e=>({id:'e_'+sl(e),t:e}))
 };
}
const plBases=()=>[plFabrica('preventivo'),plFabrica('correctivo')];

/* ---- Cuál formato le toca a una orden ----
   Manda el que coincida en servicio Y tipo de equipo. Si no hay uno
   específico para ese equipo, el del servicio. Si tampoco, el de
   fábrica. El técnico solo escoge cuando hay empate.                 */
function plCandidatas(lista,servicio,equipo){
 const act=(lista||[]).filter(p=>p.activo!==false&&p.servicio===servicio);
 if(equipo){
  const exactas=act.filter(p=>p.equipo&&p.equipo===equipo);
  if(exactas.length) return exactas;
 }
 //  Primero los generales, y los de fábrica de último: si la empresa
 //  armó uno propio, ese es el que manda.
 return act.slice().sort((a,b)=>((a.base?1:0)-(b.base?1:0))||((a.equipo?1:0)-(b.equipo?1:0)));
}
function plEscoger(lista,servicio,equipo){
 const c=plCandidatas(lista,servicio,equipo);
 if(c.length) return c[0];
 return plFabrica(servicio==='correctivo'?'correctivo':'preventivo');
}
/* ---- Lo que el técnico puede escoger ----
   Si la empresa armó formatos propios, esos son los únicos que se le
   ofrecen: para eso los armó. Si no armó ninguno, el de fábrica.    */
function plOpciones(lista,servicio,equipo){
 const c=plCandidatas(lista,servicio,equipo);
 return c.length?c:[plFabrica(servicio==='correctivo'?'correctivo':'preventivo')];
}
function plPorId(lista,id,servicio){
 const f=(lista||[]).find(p=>p.id===id);
 if(f) return f;
 if(id&&/^base-/.test(id)) return plFabrica(id.replace('base-',''));
 return plFabrica(servicio==='correctivo'?'correctivo':'preventivo');
}
const plOn=(pl,id)=>(pl.secciones||[]).some(s=>s.id===id&&s.on);
const plOrden=pl=>(pl.secciones||[]).filter(s=>s.on).map(s=>s.id);

/* ---- De la base de datos y hacia la base de datos ---- */
const dnPlantilla=(id,d)=>({id,
 nombre:d.nombre||'', titulo:d.titulo||'', servicio:d.servicio||'preventivo',

function plHoja(ctx){
 const {pl,R,esc,fdate}=ctx;
 let h=`<div class="phead">
  <div class="pco">${ctx.logo?`<img src="${ctx.logo}" class="plogo">`:esc(ctx.empresa||'')}</div>
  <div class="pti">${esc(pl.titulo||'REPORTE DE SERVICIO')}</div>
  <div class="pnum"><div class="sm">ORDEN DE SERVICIO</div><b>${esc(ctx.numero||'')}</b></div>
 </div>

 </table>`;
 plOrden(pl).forEach(id=>{ h+=plPedazo(id,ctx) });
 return h;

function plPedazo(id,ctx){
 const {pl,R,esc,fdate}=ctx;

 switch(id){
  case 'servicio':
   return `<table class="pt"><tr><td class="lb">Hora entrada</td><td>${v(R.horaEntrada)}</td>
     <td class="lb">Hora salida</td><td>${v(R.horaSalida)}</td></tr></table>`;
  case 'equipos':{
   const eqs=R.equipos||[];
   const filas=[0,1,2].map(i=>{const e=eqs[i]||{};
    return `<tr><td>${v(PL_ROLES[i])}</td><td>${v(e.tipo)}</td><td>${v(e.capacidad)}</td>
     <td>${v(e.marca)}</td><td>${v(e.modelo)}</td><td>${v(e.serie)}</td>
     <td>${v(e.ubicacion)}</td><td>${v(e.numero)}</td></tr>`}).join('');
   return `<table class="pt"><tr><th colspan="8" class="gh">Identificación del equipo</th></tr>
    <tr><th>Equipo</th><th>Tipo</th><th>Capac.</th><th>Marca</th><th>Modelo</th><th>Serie</th><th>Ubicación</th><th>No.</th></tr>${filas}</table>
    ${ctx.tipos?`<div class="pconv">${ctx.tipos}</div>`:''}`;
  }
  case 'chequeos':{
   const ch=R.checks||{};
   if(!(pl.chequeos||[]).length) return '';
   return `<div class="pcols">${pl.chequeos.map(g=>`<table class="pt">
     <tr><th colspan="2" class="gh">${esc(g.g)}</th></tr>
     ${g.items.map(it=>`<tr><td>${esc(it.t)}</td><td class="v">${ch[it.id]?'X':''}</td></tr>`).join('')}
    </table>`).join('')}</div>`;
  }
  case 'datos':{
   const dt=R.datos||{};
   if(!(pl.datos||[]).length) return '';
   return `<div class="pcols">${pl.datos.map(g=>`<table class="pt">
     <tr><th colspan="2" class="gh">${esc(g.g)}</th></tr>
     ${g.items.map(it=>`<tr><td>${esc(it.t)}</td><td class="v">${v(dt[it.id])}</td></tr>`).join('')}
    </table>`).join('')}</div>`;
  }
  case 'materiales':{
   const mats=(R.materiales&&R.materiales.length)?R.materiales:[{}];
   return `<table class="pt"><tr><th>Descripción de materiales y repuestos</th>
     <th style="width:60px">Unid.</th><th style="width:60px">Cant.</th></tr>
     ${mats.map(m=>`<tr><td>${v(m.descripcion)}</td><td class="v">${v(m.unidad)}</td><td class="v">${v(m.cantidad)}</td></tr>`).join('')}</table>`;
  }
  case 'actividad':
   return `<table class="pt"><tr><th>Descripción de la actividad</th></tr>
     <tr><td class="tall">${v(R.actividad)}</td></tr></table>`;
  case 'recom':
   return `<table class="pt"><tr><th>Recomendaciones del técnico</th></tr>
     <tr><td class="tall">${v(R.recomendaciones)}</td></tr></table>`;
  case 'observ':
   return `<table class="pt"><tr><th>Observaciones del cliente</th></tr>
     <tr><td class="tall">${v(R.observaciones)}</td></tr></table>`;
  case 'evaluacion':{
   const ev=R.evaluacion||{};
   if(!(pl.evaluacion||[]).length) return '';
   return `<table class="pt"><tr><th>Evaluación del servicio · califique de 1 a 5, donde 5 es el máximo</th>
     ${[1,2,3,4,5].map(n=>`<th style="width:44px">${n}</th>`).join('')}</tr>
     ${pl.evaluacion.map(e=>`<tr><td>${esc(e.t)}</td>
       ${[1,2,3,4,5].map(n=>`<td class="v">${ev[e.id]===n?'X':''}</td>`).join('')}</tr>`).join('')}</table>`;
  }
  case 'fotos':
   return ctx.fotosHtml||'';
  case 'firmas':
   return `<div class="pfirmas">
     <div><div class="fbox">${R.firmaCliente?`<img src="${R.firmaCliente}">`:''}</div>
      <div class="fl">FIRMA DEL CLIENTE</div><div class="sm">${v(R.firmaClienteNombre)}</div></div>
     <div><div class="fbox">${R.firmaTecnico?`<img src="${R.firmaTecnico}">`:''}</div>
      <div class="fl">FIRMA DEL TÉCNICO</div><div class="sm">${v(R.firmaTecnicoNombre)}</div></div>

 }

}

/* ---- Antes de guardar: fuera los renglones vacíos ---- */
function plLimpia(p){
 const lim=L=>(L||[]).map(g=>({id:g.id,g:(g.g||'').trim(),
    items:(g.items||[]).filter(i=>(i.t||'').trim()).map(i=>({id:i.id,t:i.t.trim()}))}))
   .filter(g=>g.g&&g.items.length);
 p.nombre=(p.nombre||'').trim(); p.titulo=(p.titulo||'').trim();
 p.chequeos=lim(p.chequeos); p.datos=lim(p.datos);
 p.evaluacion=(p.evaluacion||[]).filter(e=>(e.t||'').trim()).map(e=>({id:e.id,t:e.t.trim()}));
 //  Si una sección se quedó sin nada que mostrar, se apaga: una hoja con
 //  un título y un cuadro en blanco se ve peor que no tenerlo.
 const vacia={chequeos:!p.chequeos.length,datos:!p.datos.length,evaluacion:!p.evaluacion.length};
 p.secciones=(p.secciones||[]).map(s=>({id:s.id,on:vacia[s.id]?false:s.on!==false}));
 return p;
}
function plFalla(p){
 if((p.nombre||'').trim().length<2) return 'Póngale un nombre al formato (al menos 2 letras).';
 if((p.titulo||'').trim().length<3) return 'Escriba el título que sale impreso en la hoja.';
 if(!(p.secciones||[]).some(s=>s.on)) return 'Prenda al menos una sección.';
 return '';
}

/* ================= REGISTRO FOTOGRÁFICO ================= */
//  Cada foto se guarda en dos piezas: una miniatura diminuta (la que se
//  lista y se muestra en el celular) y la foto buena en un documento
//  aparte. El navegador descomprime en memoria TODA imagen que dibuja,
//  así que mostrar miniaturas de verdad es lo que evita que se quede sin
//  memoria con varias fotos abiertas.
const FASES=[['antes','Antes'],['durante','Durante'],['despues','Después']];
const MAX_FOTOS=6;          // por fase
const LADO_FOTO=1024;       // foto buena
const LADO_MINI=240;        // miniatura
let FOTOS={antes:[],durante:[],despues:[]};

async function cargarFotos(oid){
 FOTOS={antes:[],durante:[],despues:[]};
 try{
  const snap=await FB.getDocs(FB.collection(FB.fs,'tenants',TENANT,'workOrders',oid,'photos'));
  snap.forEach(d=>{const x=d.data(); const f=FOTOS[x.fase];
   if(f) f.push({id:d.id,thumb:x.thumb||x.data||'',at:x.at&&x.at.toDate?x.at.toDate():null})});
  Object.values(FOTOS).forEach(l=>l.sort((a,b)=>(a.at&&b.at)?a.at-b.at:0));
 }catch(e){ console.error('fotos',e) }
}

const usaMateriales=()=>((REP&&REP.materiales)||[]).length>0;
const faseFalta=k=>usaMateriales()&&!FOTOS[k].length;
function faltanFases(){ return FASES.filter(([k])=>faseFalta(k)).map(([,l])=>l) }

function bloqueFotos(firmado){

// Reduce una imagen a un lado máximo y la devuelve como JPEG.
function escalar(img, lado, calidad){
 let w=img.width, h=img.height;
 if(w>h && w>lado){ h=Math.round(h*lado/w); w=lado }
 else if(h>=w && h>lado){ w=Math.round(w*lado/h); h=lado }
 const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
 cv.getContext('2d').drawImage(img,0,0,w,h);
 const url=cv.toDataURL('image/jpeg',calidad);
 cv.width=cv.height=1;   // libera el lienzo de una vez
 return url;
}
function comprimir(file){
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('El archivo no es una imagen válida.')) };
  img.onload=()=>{
   try{
    let full=escalar(img,LADO_FOTO,0.6);
    if(full.length>700000) full=escalar(img,860,0.5);
    const thumb=escalar(img,LADO_MINI,0.6);
    URL.revokeObjectURL(url);
    img.src=''; 
    if(full.length>880000) return rej(new Error('La foto es demasiado pesada incluso comprimida.'));
    if(thumb.length>78000)  return rej(new Error('No se pudo hacer la miniatura.'));
    res({full,thumb});
   }catch(e){ URL.revokeObjectURL(url); rej(e) }
  };
  img.src=url;
 });
}

// Sirve para el botón de la cámara (una foto) y para el de la galería
// (varias de una). Se suben una por una para no ahogar la memoria del
// celular ni la conexión.
// Ojo: pintarReporte() vuelve a dibujar la pantalla y con ella el aviso,
// así que el aviso se busca de nuevo cada vez en vez de guardar la caja.
function avisoFoto(texto,clase){
 const e=$('fmsgF');
 if(e){ e.className='msg '+(clase||'ok'); e.textContent=texto }
}
async function agregarFoto(fase,input){
 const files=Array.from((input&&input.files)||[]); if(input) input.value='';
 if(!files.length) return;
 const libres=MAX_FOTOS-FOTOS[fase].length;
 if(libres<=0){ avisoFoto('Ya tiene '+MAX_FOTOS+' fotos en esa fase.','err'); return }
 const lote=files.slice(0,libres);
 const sobran=files.length-lote.length;
 let subidas=0;
 for(let i=0;i<lote.length;i++){
  avisoFoto(lote.length>1?('Procesando foto '+(i+1)+' de '+lote.length+'…'):'Procesando la foto…','ok');
  try{
   const {full,thumb}=await comprimir(lote[i]);
   avisoFoto('Subiendo… ('+Math.round(full.length/1024)+' KB)','ok');
   const col=FB.collection(FB.fs,'tenants',TENANT,'workOrders',REPORD._id,'photos');
   const ref=await FB.addDoc(col,{fase,thumb,nota:null,by:FB.auth.currentUser.uid,
     byName:(ME&&ME.name)||null,at:FB.serverTimestamp()});
   await FB.setDoc(FB.doc(FB.fs,'tenants',TENANT,'workOrders',REPORD._id,'photoFiles',ref.id),{data:full});
   // La foto grande NO se queda en memoria: solo la miniatura.
   FOTOS[fase].push({id:ref.id,thumb,at:new Date()});
   subidas++;
   pintarReporte();
  }catch(e){
   console.error(e);
   pintarReporte();
   avisoFoto('No se pudo guardar '+(lote.length>1?('la foto '+(i+1)+': '):'la foto: ')+(e.message||errMsg(e)),'err');
   return;
  }
 }
 avisoFoto((subidas>1?subidas+' fotos guardadas.':'Foto guardada.')
  +(sobran?' Quedaron '+sobran+' por fuera: el máximo es '+MAX_FOTOS+' por fase.':''),'ok');
}
async function borrarFoto(id,fase){
 if(!confirm('¿Borrar esta foto?')) return;
 try{
  await FB.deleteDoc(FB.doc(FB.fs,'tenants',TENANT,'workOrders',REPORD._id,'photos',id));
  try{ await FB.deleteDoc(FB.doc(FB.fs,'tenants',TENANT,'workOrders',REPORD._id,'photoFiles',id)) }catch(e){}
  FOTOS[fase]=FOTOS[fase].filter(f=>f.id!==id);

 }catch(e){
  const m=$('fmsgF'); m.className='msg err';
  m.textContent='No se pudo borrar: '+errMsg(e)+'. Si el cliente ya firmó, la foto queda como evidencia.';
 }
}

/* ---- Firma con el dedo, a pantalla completa ---- */
let FIRMA_QUIEN=null, fmCtx=null, fmDirty=false;

function abrirFirma(quien){
 recogerReporte();
 FIRMA_QUIEN=quien;
 $('fmTit').textContent=(quien==='cliente')?'Firma del cliente':'Firma del técnico';
 guardarLocal();
 view('vFirma');
 // El lienzo se dimensiona cuando la pantalla YA está visible: si se hace
 // antes, mide cero y no pinta nada.
 requestAnimationFrame(()=>requestAnimationFrame(prepararLienzo));
}
function prepararLienzo(){
 const cv=$('fmCv'); if(!cv) return;
 const r=cv.getBoundingClientRect();
 const w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
 const dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
 const x=cv.getContext('2d');
 x.setTransform(dpr,0,0,dpr,0,0);
 x.fillStyle='#fff'; x.fillRect(0,0,w,h);
 x.lineWidth=2.6; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111';
 fmCtx=x; fmDirty=false;

 let abajo=false, px=0, py=0;
 const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left, e.clientY-b.top]};
 cv.onpointerdown=e=>{
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId) }catch(err){}
  abajo=true; [px,py]=pos(e);
  x.beginPath(); x.moveTo(px,py); x.lineTo(px+0.2,py+0.2); x.stroke();
  fmDirty=true;
 };
 cv.onpointermove=e=>{
  if(!abajo) return; e.preventDefault();
  const [a,b2]=pos(e);
  x.beginPath(); x.moveTo(px,py); x.lineTo(a,b2); x.stroke();
  px=a; py=b2; fmDirty=true;
 };
 cv.onpointerup=cv.onpointercancel=cv.onpointerleave=()=>{ abajo=false };
}
function borrarFirma(){ prepararLienzo() }
function cerrarFirma(){ view('vRep'); pintarReporte() }
function guardarFirma(){
 if(!fmDirty){ alert('Todavía no hay ninguna firma en la pantalla.'); return }
 const cv=$('fmCv');
 // Se reduce para que quepa holgada dentro del documento de Firestore.
 const out=document.createElement('canvas'); out.width=520; out.height=170;
 const c=out.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,520,170);
 c.drawImage(cv,0,0,520,170);
 const url=out.toDataURL('image/png');
 if(FIRMA_QUIEN==='cliente') firmas.cliente=url; else firmas.tecnico=url;
 view('vRep'); pintarReporte(); guardarLocal(); sucio=true; estadoAuto('pend');
}
window.addEventListener('orientationchange',()=>{ if(!$('vFirma').hidden) setTimeout(prepararLienzo,250) });

/* ================= AUTOGUARDADO ================= */
//  Dos capas: el borrador se copia al celular en cada tecla (instantáneo,
//  sobrevive a que se cierre la app) y se sube a la nube cada pocos
//  segundos. Si la subida falla, la copia local queda esperando.
let autoT=null, sucio=false, guardando=false, ultimoOk=null, oyentePuesto=false;
const claveBorrador=()=> 'hvac360_borrador_'+TENANT+'_'+(REPORD?REPORD._id:'');

function guardarLocal(){
 try{ localStorage.setItem(claveBorrador(), JSON.stringify({rep:REP,firmas,ts:Date.now()})) }catch(e){}
}
function limpiarLocal(){ try{ localStorage.removeItem(claveBorrador()) }catch(e){} }
function leerLocal(){ try{ return JSON.parse(localStorage.getItem(claveBorrador())||'null') }catch(e){ return null } }

function estadoAuto(e,extra){
 const b=$('autoEstado'); if(!b) return;
 const h=ultimoOk?ultimoOk.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):'';
 if(e==='pend')      { b.className='autoE pend'; b.textContent='Cambios sin subir \u2014 se guardan solos' }
 else if(e==='sube') { b.className='autoE pend'; b.textContent='Guardando\u2026' }
 else if(e==='ok')   { b.className='autoE ok';   b.textContent='Guardado'+(h?' a las '+h:'') }
 else if(e==='err')  { b.className='autoE err';  b.textContent='No se pudo subir ('+(extra||'')+'). Queda guardado en este celular.' }
 else                { b.className='autoE'; b.textContent='' }
}
function marcarSucio(){
 if(!REPORD||REP&&REP.firmaCliente) return;
 recogerReporte(); guardarLocal();
 sucio=true; estadoAuto('pend');
 clearTimeout(autoT); autoT=setTimeout(autoGuardar, 4000);
}
async function escribirFicha(){
 const ref=FB.doc(FB.fs,'tenants',TENANT,'workOrders',REPORD._id,'report','ficha');
 const payload=Object.assign({},REP,{updatedAt:FB.serverTimestamp(),updatedBy:FB.auth.currentUser.uid});
 if(!payload.createdAt){payload.createdAt=FB.serverTimestamp();payload.createdBy=FB.auth.currentUser.uid}
 await FB.setDoc(ref,payload);
}
async function autoGuardar(){
 if(!sucio||!REPORD||guardando) return;
 if(REP.firmaCliente) return;          // ya firmado: no se toca
 guardando=true; estadoAuto('sube');
 try{
  if(firmas.tecnico) REP.firmaTecnico=firmas.tecnico;
  await escribirFicha();
  sucio=false; ultimoOk=new Date(); limpiarLocal(); estadoAuto('ok');
 }catch(e){
  console.error('autoguardado',e);
  estadoAuto('err', e.code||'sin conexión');
 }
 guardando=false;
}
function ponerOyentes(){
 if(oyentePuesto) return; oyentePuesto=true;
 const b=$('repBody');
 b.addEventListener('input', marcarSucio);
 b.addEventListener('change', marcarSucio);
 // Al salir de un campo se sube de una, sin esperar el temporizador.
 b.addEventListener('focusout',()=>{ marcarSucio(); clearTimeout(autoT); autoT=setTimeout(autoGuardar,800) });
 // Al salir de la app o apagar la pantalla, se asegura la copia local
 // y se intenta subir lo pendiente.
 document.addEventListener('visibilitychange',()=>{ if(document.hidden&&REPORD){ guardarLocal(); autoGuardar() } });
 window.addEventListener('pagehide',()=>{ if(REPORD) guardarLocal() });
}

async function guardarReporte(firmar){
 recogerReporte();
 const m=$('rmsg');
 const fc=firmas.cliente, ft=firmas.tecnico;
 if(ft) REP.firmaTecnico=ft;
 if(firmar){
  if(!fc){ m.className='msg err'; m.textContent='Falta la firma del cliente. Páse le el celular para que firme.'; return }
  if(!(REP.firmaClienteNombre||'').trim()){ m.className='msg err'; m.textContent='Escriba el nombre de quien recibe.'; return }
  // Si se usaron repuestos, el reporte debe señalar una foto de cada fase.
  if(usaMateriales()){
   const falta=faltanFases();
   if(falta.length){
    m.className='msg err';
    m.textContent='No se puede cerrar: este servicio consumió repuestos y faltan fotos de '+falta.join(', ')+'.';
    m.scrollIntoView({block:'center'});
    alert('Faltan fotos de: '+falta.join(', ')+'.\n\nCuando se usan repuestos, el reporte exige una foto de antes, una de durante y una de después.');
    return;
   }
   REP.evidencia={antes:FOTOS.antes[0].id,durante:FOTOS.durante[0].id,despues:FOTOS.despues[0].id};
  }
  REP.firmaCliente=fc;
 }
 REP.firmaTecnicoNombre=(ME&&ME.name)||null;
 m.className='msg ok'; m.textContent='Guardando…';
 try{
  await escribirFicha();
  sucio=false; ultimoOk=new Date(); limpiarLocal(); estadoAuto('ok');
  m.className='msg ok';
  m.textContent=firmar?'Reporte firmado y guardado. Ya lo ve la oficina.':'Borrador guardado.';
  m.scrollIntoView({block:'center'});
  if(firmar){ REP.firmaCliente=fc; pintarReporte(); alert('Reporte guardado. La oficina ya lo puede ver e imprimir.') }
 }catch(e){
  console.error(e);
  const t='No se pudo guardar: '+errMsg(e)+(e.code?' ['+e.code+']':'');
  m.className='msg err'; m.textContent=t; m.scrollIntoView({block:'center'});
  // Un fallo aquí significa que el reporte NO quedó guardado: hay que verlo sí o sí.
  alert(t);
 }
}

  await FB.setDoc(FB.doc(FB.fs,'tenants',TENANT,'expenses',id),{
   seq:Math.floor(Date.now()/1000), number:id, date:fecha, category:cat, concept:conc,
   amount:val, fuente, techId:null, techUid:u, techName:(ME&&ME.name)||null,
   orderId:oid||null, orderNumber:o?(o.number||o._id):null,
   proveedor:$('gxProv').value.trim()||null, nit:null, soporte:$('gxSop').value.trim()||null,
   thumb:GREC?GREC.thumb:null, nota:null, status:'pendiente', aprobadoPor:null,
   pagado:false, pagadoEl:null, advanceId:null,
   createdAt:FB.serverTimestamp(), createdBy:u,
   updatedAt:FB.serverTimestamp(), updatedBy:u});
  if(GREC){
   try{ await FB.setDoc(FB.doc(FB.fs,'tenants',TENANT,'expenses',id,'file','recibo'),{data:GREC.full}) }
   catch(e){ console.error(e) }
  }
  GREC=null;
  await abrirGastos();
 }catch(e){
  console.error(e);
  msg('gxMsg','No se pudo enviar: '+errMsg(e),'err');
  $('gxBtn').disabled=false;
 }
}


/* ================= INSTALAR EN EL CELULAR =================
   Hace que la página se pueda guardar como una app de verdad: ícono en
   la pantalla de inicio, pantalla completa sin barra del navegador, y
   que abra aunque no haya señal. Los datos siguen viniendo de Firebase
   cuando hay internet.                                                */
let promesaInstalar=null;
const yaInstalada=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const esIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;

function verBotonInstalar(mostrar){
 const b=document.getElementById('btnInstalar');
 if(b) b.hidden=!mostrar;
}
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault(); promesaInstalar=e; verBotonInstalar(true);
});
window.addEventListener('appinstalled',()=>{
 promesaInstalar=null; verBotonInstalar(false);
});
async function instalarApp(){
 if(promesaInstalar){
  promesaInstalar.prompt();
  try{ await promesaInstalar.userChoice }catch(e){}
  promesaInstalar=null; verBotonInstalar(false);
  return;
 }
 if(esIOS()){
  alert('Para instalarla en un iPhone:\n\n1. Toque el botón Compartir (el cuadrito con la flecha hacia arriba).\n2. Baje y toque «Agregar a la pantalla de inicio».\n3. Toque «Agregar».\n\nLe queda el ícono junto a sus otras aplicaciones.');
  return;
 }
 alert('Para instalarla:\n\n1. Abra el menú del navegador (los tres puntos).\n2. Toque «Instalar aplicación» o «Agregar a la pantalla de inicio».\n\nSi no le aparece la opción, asegúrese de estar entrando por la dirección de internet (https) y no por un archivo guardado.');
}
function prepararInstalacion(){
 if(yaInstalada()){ verBotonInstalar(false); return }
 if(esIOS()) verBotonInstalar(true);          // iPhone no avisa solo: el botón explica cómo
 const seguro=location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
 if('serviceWorker' in navigator && seguro){
  navigator.serviceWorker.register('sw.js').catch(e=>console.log('No se pudo preparar el modo sin señal:',e.message));
 }
}
window.addEventListener('load',prepararInstalacion);

if(window.FB) arrancar(); else window.addEventListener('fb-ready',arrancar);
</script>
