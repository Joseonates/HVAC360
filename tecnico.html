<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>HVAC 360° · Técnico</title>
<style>
:root{--bg:#0f1419;--panel:#182029;--line:#28323e;--text:#e8edf3;--muted:#8b97a5;--accent:#2f7df6;
 --green:#1f9d55;--yellow:#c9931a;--orange:#d2762a;--red:#c8392f;--blue:#2f7df6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1;font-weight:600}
header .who{font-size:12px;color:var(--muted)}
.icbtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
main{padding:14px 16px 90px;max-width:620px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
.card.tap:active{border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.num{font-weight:700;font-size:15px}
.cli{font-size:15px;margin:6px 0 2px}
.sub{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.c-programada{background:rgba(201,147,26,.18);color:#e8b84b}
.c-en_ruta{background:rgba(47,125,246,.18);color:#6fa8ff}
.c-en_servicio{background:rgba(31,157,85,.18);color:#4fc584}
.c-completada{background:rgba(31,157,85,.18);color:#4fc584}
.c-pendiente{background:rgba(210,118,42,.18);color:#e29a5c}
.c-cancelada{background:rgba(139,151,165,.18);color:var(--muted)}
.c-alta,.c-critica{background:rgba(200,57,47,.18);color:#e8756b}
.c-hoy{background:rgba(47,125,246,.18);color:#6fa8ff}
.c-vencida{background:rgba(200,57,47,.2);color:#e8756b}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:11px;background:var(--accent);color:#fff;
 font:inherit;font-size:16px;font-weight:700;margin-top:12px}
.btn:disabled{opacity:.5}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px;padding:12px}
.btn.warn{background:transparent;border:1px solid var(--red);color:#e8756b;font-weight:600;font-size:14px;padding:12px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;margin-top:6px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:12px 0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
.empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px}
.msg{padding:11px 13px;border-radius:9px;font-size:13px;margin-top:12px;display:none}
.msg.err{background:rgba(200,57,47,.15);color:#e8756b;display:block}
.msg.ok{background:rgba(31,157,85,.15);color:#4fc584;display:block}
.login{max-width:360px;margin:0 auto;padding:40px 4px}
.logo{font-size:26px;font-weight:700;margin-bottom:4px}
.logo span{color:var(--accent)}
.hist{border-left:2px solid var(--line);padding-left:12px;margin-top:6px}
.hist div{font-size:13px;color:var(--muted);margin-bottom:7px}
.hdlogo{height:34px;max-width:96px;background:#fff;padding:3px 5px;border-radius:7px;object-fit:contain}
.off{background:var(--orange);color:#fff;text-align:center;font-size:12px;padding:5px;font-weight:600}
.secTit{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 9px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 64px 64px;gap:7px;margin-bottom:7px}
.g3 input{margin-top:0}
.ck{display:flex;align-items:center;gap:10px;font-weight:400;color:var(--text);font-size:14px;margin-bottom:9px}
.ck input{width:21px;height:21px;margin:0;flex:none;accent-color:var(--accent)}
.stars{display:flex;gap:7px}
.st{flex:1;padding:10px 0;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font:inherit;font-weight:700}
.st.on{background:var(--accent);border-color:var(--accent);color:#fff}
.firmaCv{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:9px;touch-action:none;display:block}
.firmaImg{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;display:block}
/* ---- Hoja para imprimir o guardar como PDF ---- */
#prSheet{background:#fff;color:#000;padding:12px}
#prBody{font-family:Arial,Helvetica,sans-serif;font-size:9.5px;color:#000;max-width:800px;margin:0 auto}
.phead{display:flex;align-items:stretch;border:1px solid #000;margin-bottom:6px}
.pco{padding:6px 10px;font-weight:700;font-size:13px;border-right:1px solid #000;display:flex;align-items:center;justify-content:center;min-width:150px;max-width:190px}
.plogo{max-height:52px;max-width:170px}
.pti{flex:1;padding:8px 10px;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.pnum{border-left:1px solid #000;padding:6px 10px;text-align:center;min-width:130px}
.pnum .sm{font-size:8px;font-weight:700}
.pt{width:100%;border-collapse:collapse;margin-bottom:6px}
.pt td,.pt th{border:1px solid #000;padding:2.5px 5px;text-align:left;vertical-align:top}
.pt th{background:#1f6fd0;color:#fff;font-size:8.5px;font-weight:700}
.pt th.gh{background:#1f6fd0;text-align:center;text-transform:uppercase}
.pt td.lb{background:#eef2f7;font-weight:700;width:90px}
.pt td.v{width:44px;text-align:center;font-weight:700}
.pt td.tall{height:52px}
.pcols{column-count:3;column-gap:6px}
.pcols table{break-inside:avoid;width:100%}
.pconv{font-size:7.5px;margin:-2px 0 7px;line-height:1.3}
.pfirmas{display:flex;gap:26px;margin-top:16px;text-align:center}
.pfirmas>div{flex:1}
.fbox{height:56px;border-bottom:1px solid #000;display:flex;align-items:flex-end;justify-content:center}
.fbox img{max-height:54px}
.fl{font-size:9px;font-weight:700;margin-top:3px}
.sm{font-size:8px}
.prbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.prbar button{flex:1;padding:12px;border-radius:9px;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700}
.prbar button.sec{background:transparent;border:1px solid var(--line);color:var(--text)}
@media print{
 body{background:#fff}
 #vLogin,#vList,#vDet,#vRep,#offline,.prbar{display:none!important}
 #vPrint{display:block!important}
 #prSheet{padding:0}
 @page{size:letter;margin:9mm}
}
</style>
</head>
<body>

<div id="offline" class="off" hidden>Sin conexión — sus cambios se guardan y se envían al volver la señal</div>

<div id="vLogin" hidden>
 <main><div class="login">
  <div class="logo">HVAC <span>360°</span></div>
  <p class="sub" style="margin:0 0 26px">App del técnico</p>
  <label>Correo<input id="em" type="email" autocomplete="username" inputmode="email" placeholder="usted@empresa.com"></label>
  <label>Contraseña<input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
  <button class="btn" id="inBtn" onclick="entrar()">Entrar</button>
  <div id="lmsg" class="msg"></div>
 </div></main>
</div>

<div id="vList" hidden>
 <header>
  <img id="hdLogo" class="hdlogo" hidden>
  <div style="flex:1"><h1 id="hName">—</h1><div class="who" id="hCo"></div></div>
  <button class="icbtn" onclick="salir()">Salir</button>
 </header>
 <main>
  <div class="tabs">
   <button id="tHoy" class="on" onclick="setTab('hoy')">Hoy</button>
   <button id="tAbi" onclick="setTab('abiertas')">Abiertas</button>
   <button id="tTod" onclick="setTab('todas')">Todas</button>
  </div>
  <div id="list"></div>
 </main>
</div>

<div id="vDet" hidden>
 <header>
  <button class="icbtn" onclick="volver()">‹ Volver</button>
  <h1 id="dNum" style="text-align:center">—</h1>
  <span style="width:62px"></span>
 </header>
 <main id="detBody"></main>
</div>

<div id="vRep" hidden>
 <header>
  <button class="icbtn" onclick="cerrarReporte()">‹ Volver</button>
  <img id="repLogo" class="hdlogo" hidden>
  <h1 id="repTit" style="text-align:center;font-size:14px;flex:1">Reporte</h1>
  <span style="width:62px"></span>
 </header>
 <main id="repBody"></main>
</div>

<div id="vPrint" hidden>
 <div class="prbar">
  <button class="sec" onclick="cerrarImpresion()">‹ Volver</button>
  <button onclick="imprimir()">Imprimir / Guardar PDF</button>
 </div>
 <div id="prSheet"><div id="prBody"></div></div>
</div>

<script type="module">
const V='12.19.0', B='https://www.gstatic.com/firebasejs/'+V+'/';
try{
 const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=A.initializeApp({
  apiKey:"AIzaSyBDsf7oXAlsw38mYHHCn6wVxM4JcGq-jDU",
  authDomain:"hvac360.firebaseapp.com",
  projectId:"hvac360",
  storageBucket:"hvac360.firebasestorage.app",
  messagingSenderId:"217756579102",
  appId:"1:217756579102:web:343e9b8bdf004dbac4050f"});
 let fs;
 try{ fs=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({})}) }
 catch(e){ fs=Fs.getFirestore(app) }
 window.FB=Object.assign({},Au,Fs,{auth:Au.getAuth(app),fs});
 window.dispatchEvent(new Event('fb-ready'));
}catch(e){
 document.getElementById('lmsg').className='msg err';
 document.getElementById('lmsg').textContent='No se pudo cargar Firebase: '+e.message;

<script>
const $=i=>document.getElementById(i);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL={pendiente:'Pendiente',programada:'Programada',en_ruta:'En ruta',en_servicio:'En servicio',completada:'Completada',cancelada:'Cancelada'};
const TLBL={preventivo:'Preventivo',correctivo:'Correctivo',instalacion:'Instalación',emergencia:'Emergencia'};
const PLBL={normal:'Normal',media:'Media',alta:'Alta',critica:'Crítica'};
const NEXT={programada:'en_ruta',en_ruta:'en_servicio',en_servicio:'completada'};
const NEXTL={en_ruta:'Salgo para allá',en_servicio:'Llegué, inicio servicio',completada:'Terminé el servicio'};

let TENANT=null, ME=null, ORDERS=[], TAB='hoy', DET=null, unsub=null, EMPRESA='', LOGO='';
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
function view(v){['vLogin','vList','vDet','vRep','vPrint'].forEach(x=>$(x).hidden=(x!==v));window.scrollTo(0,0)}
function msg(el,t,cls){const e=$(el);e.textContent=t;e.className='msg'+(t?' '+cls:'')}

function errMsg(e){
 const c=(e&&e.code)||'';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Correo o contraseña incorrectos.';
 if(c.includes('too-many-requests'))return 'Demasiados intentos. Espere un momento.';
 if(c.includes('unauthorized-domain'))return 'Este dominio no está autorizado en Firebase.';
 if(c.includes('permission-denied'))return 'No tiene permiso. Pídale al administrador que revise su acceso.';
 if(c.includes('unavailable'))return 'Sin conexión con el servidor.';
 return (e&&e.message)||'Error desconocido.';
}
async function entrar(){
 const e=$('em').value.trim(), p=$('pw').value;
 if(!e||!p){msg('lmsg','Escriba su correo y su contraseña.','err');return}
 msg('lmsg','Entrando…','ok'); $('inBtn').disabled=true;
 try{ await FB.signInWithEmailAndPassword(FB.auth,e,p) }
 catch(err){ msg('lmsg',errMsg(err),'err'); $('inBtn').disabled=false }
}
async function salir(){ if(!confirm('¿Cerrar sesión?'))return; if(unsub)unsub(); await FB.signOut(FB.auth); location.reload() }

async function alEntrar(u){
 try{
  const ud=await FB.getDoc(FB.doc(FB.fs,'users',u.uid));
  if(!ud.exists()){msg('lmsg','Su cuenta no está vinculada a ninguna empresa.','err');$('inBtn').disabled=false;await FB.signOut(FB.auth);return}
  TENANT=ud.data().tenantId;
  const [md,td]=await Promise.all([
   FB.getDoc(FB.doc(FB.fs,'tenants',TENANT,'members',u.uid)),
   FB.getDoc(FB.doc(FB.fs,'tenants',TENANT))]);
  EMPRESA=td.exists()?(td.data().name||''):'';
  LOGO=td.exists()?(td.data().logoUrl||''):'';
  aplicarLogo();
  if(!md.exists()||md.data().active===false){msg('lmsg','Su usuario está inactivo.','err');$('inBtn').disabled=false;await FB.signOut(FB.auth);return}
  ME=md.data();
  $('hName').textContent=ME.name||'Técnico';
  $('hCo').textContent=(ME.role==='tecnico')?'Sus órdenes de trabajo':'Vista de técnico · rol '+ME.role;
  escuchar(u.uid);
  view('vList');
 }catch(e){ msg('lmsg',errMsg(e),'err'); $('inBtn').disabled=false }
}
function escuchar(myUid){
 const q=FB.query(FB.collection(FB.fs,'tenants',TENANT,'workOrders'),FB.where('techUid','==',myUid));
 unsub=FB.onSnapshot(q,snap=>{
  ORDERS=[]; snap.forEach(d=>ORDERS.push(Object.assign({_id:d.id},d.data())));
  ORDERS.sort((a,b)=>((a.scheduledDate||'')+(a.scheduledTime||'')).localeCompare((b.scheduledDate||'')+(b.scheduledTime||'')));
  pintar();
  if(DET){const f=ORDERS.find(o=>o._id===DET._id); if(f){DET=f; if(!$('vDet').hidden) detalle(f._id)}}
 },err=>{ console.error(err); $('list').innerHTML='<div class="empty">No se pudieron cargar sus órdenes.<br>'+esc(errMsg(err))+'</div>' });
}
function setTab(t){TAB=t;$('tHoy').className=t==='hoy'?'on':'';$('tAbi').className=t==='abiertas'?'on':'';$('tTod').className=t==='todas'?'on':'';pintar()}
const abierta=o=>o.status!=='completada'&&o.status!=='cancelada';
function filtradas(){
 if(TAB==='hoy')return ORDERS.filter(o=>abierta(o)&&(o.scheduledDate||'')<=hoy());
 if(TAB==='abiertas')return ORDERS.filter(abierta);
 return ORDERS;
}
function pintar(){
 const l=filtradas();
 if(!l.length){
  $('list').innerHTML='<div class="empty">'+(TAB==='hoy'?'Nada pendiente para hoy.<br>Buen trabajo.':'No hay órdenes aquí.')+'</div>';
  return;
 }
 $('list').innerHTML=l.map(o=>{
  const venc=abierta(o)&&o.scheduledDate&&o.scheduledDate<hoy();
  const urg=(o.priority==='alta'||o.priority==='critica');
  return `<div class="card tap" onclick="detalle('${esc(o._id)}')">
   <div class="row"><span class="num">${esc(o.number||o._id)}</span><span class="chip c-${esc(o.status)}">${esc(LBL[o.status]||o.status)}</span></div>
   <div class="cli">${esc(o.clientName||'—')}</div>
   <div class="sub">${esc(o.siteName||'—')}${o.assetCode?' · '+esc(o.assetCode):''}</div>
   <div class="sub" style="margin-top:7px">${fdate(o.scheduledDate)}${o.scheduledTime?' · '+esc(o.scheduledTime):''}
    ${venc?' <span class="chip c-vencida">Vencida</span>':''}
    ${urg?' <span class="chip c-'+esc(o.priority)+'">'+esc(PLBL[o.priority])+'</span>':''}</div>
  </div>`}).join('');
}
function volver(){DET=null;view('vList')}
function detalle(id){
 const o=ORDERS.find(x=>x._id===id); if(!o)return;
 DET=o; $('dNum').textContent=o.number||id;
 const sig=NEXT[o.status];
 $('detBody').innerHTML=`
  <div class="card">
   <div class="row"><span class="chip c-${esc(o.status)}">${esc(LBL[o.status]||o.status)}</span>
    <span class="chip c-${esc(o.priority)}">${esc(PLBL[o.priority]||o.priority)}</span></div>
   <div class="cli" style="margin-top:10px">${esc(o.clientName||'—')}</div>
   <div class="sub">${esc(o.siteName||'—')}</div>
   <dl class="dl">
    <dt>Servicio</dt><dd>${esc(TLBL[o.type]||o.type||'—')}</dd>
    <dt>Equipo</dt><dd>${esc(o.assetCode||'Sin equipo')}</dd>
    <dt>Programada</dt><dd>${fdate(o.scheduledDate)}${o.scheduledTime?' · '+esc(o.scheduledTime):''}</dd>
   </dl>
   ${o.description?`<div class="sub" style="border-top:1px solid var(--line);padding-top:11px">${esc(o.description)}</div>`:''}
  </div>
  ${sig?`<div class="card">
    <label>Nota (opcional)<textarea id="nota" placeholder="Diagnóstico, trabajo realizado, observaciones…"></textarea></label>
    <button class="btn" id="avBtn" onclick="avanzar('${esc(o.status)}')">${esc(NEXTL[sig])}</button>
    <div id="dmsg" class="msg"></div>
   </div>`:`<div class="card"><div class="sub">Esta orden está ${esc((LBL[o.status]||'').toLowerCase())}. No hay nada más que hacer desde el celular.</div><div id="dmsg" class="msg"></div></div>`}
  <button class="btn sec" onclick="abrirReporte()">Reporte de servicio para el cliente</button>
  <div class="card"><div class="sub" style="font-weight:600;color:var(--text);margin-bottom:8px">Historial</div>
   <div class="hist" id="hist"><div>Cargando…</div></div></div>`;
 view('vDet'); cargarHistorial(o._id);
}
async function cargarHistorial(id){
 try{
  const ev=await FB.getDocs(FB.collection(FB.fs,'tenants',TENANT,'workOrders',id,'events'));
  const l=[]; ev.forEach(d=>{const x=d.data();l.push({at:x.at&&x.at.toDate?x.at.toDate():null,status:x.status,note:x.note,by:x.byName})});
  l.sort((a,b)=>(a.at&&b.at)?a.at-b.at:0);
  $('hist').innerHTML=l.length?l.map(h=>`<div><b style="color:var(--text)">${esc(LBL[h.status]||h.status||'')}</b>
   ${h.at?' · '+h.at.toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):''}
   ${h.by?' · '+esc(h.by):''}${h.note?'<br>'+esc(h.note):''}</div>`).join(''):'<div>Sin movimientos todavía.</div>';
 }catch(e){ $('hist').innerHTML='<div>No se pudo cargar el historial.</div>' }
}
function ubicacion(){
 return new Promise(res=>{
  if(!navigator.geolocation) return res({lat:null,lng:null});
  const t=setTimeout(()=>res({lat:null,lng:null}),6000);
  navigator.geolocation.getCurrentPosition(
   p=>{clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude})},
   ()=>{clearTimeout(t);res({lat:null,lng:null})},{timeout:5500,maximumAge:60000});
 });
}
async function avanzar(desde){
 const o=DET; if(!o||o.status!==desde) return;
 const sig=NEXT[desde]; if(!sig) return;
 const nota=($('nota')&&$('nota').value.trim())||'';
 $('avBtn').disabled=true; msg('dmsg','Guardando…','ok');
 try{
  const g=await ubicacion();
  const ref=FB.doc(FB.fs,'tenants',TENANT,'workOrders',o._id);
  const cambio={status:sig,updatedAt:FB.serverTimestamp(),updatedBy:FB.auth.currentUser.uid};
  if(nota) cambio.statusNote=nota;
  if(sig==='en_servicio') cambio.startedAt=FB.serverTimestamp();
  if(sig==='completada') cambio.completedAt=FB.serverTimestamp();
  await FB.updateDoc(ref,cambio);
  await FB.addDoc(FB.collection(FB.fs,'tenants',TENANT,'workOrders',o._id,'events'),{
   type:'cambio_estado',status:sig,note:nota||null,by:FB.auth.currentUser.uid,
   byName:(ME&&ME.name)||null,at:FB.serverTimestamp(),lat:g.lat,lng:g.lng});
  msg('dmsg','Listo.','ok');
  setTimeout(()=>{ if(sig==='completada') volver() },700);
 }catch(e){
  console.error(e);
  msg('dmsg','No se pudo guardar: '+errMsg(e),'err');
  $('avBtn').disabled=false;
 }
}
/* ================= REPORTE DE SERVICIO ================= */
const TIPOS_EQ=[['AC','Aire Central'],['AV','Ventana'],['MSPT','Mini Split Piso Techo'],['MSC','Mini Split Casette'],
 ['MSP','Mini Split Pared'],['PAQ','Paquete'],['CH','Chiller'],['ER','Equipo de Refrigeración'],
 ['MAF','Manejadora de Agua Fría'],['TE','Torre de Enfriamiento'],['BOM','Bomba']];

const CHECKS={

let REP=null, REPORD=null, firmas={cliente:null,tecnico:null};

function tipoReporte(o){ return (o.type==='preventivo')?'preventivo':'correctivo' }

async function abrirReporte(){
 const o=DET; if(!o) return;
 REPORD=o;
 $('detBody').scrollTop=0;
 try{
  const ref=FB.doc(FB.fs,'tenants',TENANT,'workOrders',o._id,'report','ficha');
  const d=await FB.getDoc(ref);
  REP=d.exists()?d.data():{tipo:tipoReporte(o),equipos:[],checks:{},materiales:[],datos:{},evaluacion:{}};
 }catch(e){ REP={tipo:tipoReporte(o),equipos:[],checks:{},materiales:[],datos:{},evaluacion:{}} }
 REP.tipo=REP.tipo||tipoReporte(o);
 REP.equipos=REP.equipos||[]; REP.checks=REP.checks||{}; REP.materiales=REP.materiales||[];
 REP.datos=REP.datos||{}; REP.evaluacion=REP.evaluacion||{};
 firmas.cliente=REP.firmaCliente||null; firmas.tecnico=REP.firmaTecnico||null;
 pintarReporte(); view('vRep');
}
function cerrarReporte(){ view('vDet') }

   <label>Marca<input data-eq="${i}" data-f="marca" value="${esc(e.marca||'')}"></label>

   <label>Serie<input data-eq="${i}" data-f="serie" value="${esc(e.serie||'')}"></label>

   <label>No. equipo<input data-eq="${i}" data-f="numero" value="${esc(e.numero||'')}"></label>

 <div class="card">

  <div class="g2">

   </div>`).join('')}`

   <div style="font-weight:700;font-size:13px;margin-bottom:8px">${esc(g)}</div>
   <div class="g2">${items.map(it=>{const id='d_'+k(g)+'_'+k(it);
    return `<label>${esc(it)}<input data-dt="${id}" value="${esc(REP.datos[id]||'')}" inputmode="decimal"></label>`}).join('')}</div>
  </div>`).join('')}

 ${prev?`<div class="secTit">Recomendaciones y observaciones</div>
  <div class="card" style="padding:11px">
   <label>Recomendaciones del técnico<textarea id="rRec">${esc(REP.recomendaciones||'')}</textarea></label>
   <label>Observaciones del cliente<textarea id="rObs">${esc(REP.observaciones||'')}</textarea></label>
  </div>`:''}

 <div class="secTit">Evaluación del servicio</div>
 <div class="card" style="padding:11px">
  <div class="sub" style="margin-bottom:10px">Que el cliente califique de 1 a 5, donde 5 es el máximo.</div>
  ${EVALS.map(e=>{const id='e_'+k(e);
   return `<div style="margin-bottom:11px"><div class="sub" style="color:var(--text);margin-bottom:5px">${esc(e)}</div>
   <div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="st${(REP.evaluacion[id]>=n)?' on':''}" data-ev="${id}" data-n="${n}">${n}</button>`).join('')}</div></div>`}).join('')}
 </div>

 <div class="secTit">Firmas</div>

  <div class="sub" style="margin-bottom:5px">Firma del cliente</div>

   <button class="btn sec" onclick="limpiarFirma('cli')">Borrar firma</button>`}
  <div class="sub" style="margin:14px 0 5px">Firma del técnico</div>
  ${firmas.tecnico?`<img class="firmaImg" src="${firmas.tecnico}">`:`<canvas id="cvTec" class="firmaCv"></canvas>
   <button class="btn sec" onclick="limpiarFirma('tec')">Borrar firma</button>`}

 <div id="rmsg" class="msg"></div>

 <button class="btn sec" onclick="verImpresion()">Ver / imprimir el reporte</button>
 <div style="height:30px"></div>`;

 if(REP.tipo!=='preventivo') pintarMats();
 if(!firmado){ initFirma('cvCli','cli'); initFirma('cvTec','tec') }
 $('repBody').querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{
  REP.evaluacion[b.dataset.ev]=parseInt(b.dataset.n,10);
  $('repBody').querySelectorAll(`[data-ev="${b.dataset.ev}"]`).forEach(x=>
   x.classList.toggle('on',parseInt(x.dataset.n,10)<=REP.evaluacion[b.dataset.ev]));
 });
}
function pintarMats(){
 const c=$('matList'); if(!c) return;
 c.innerHTML=REP.materiales.map((m,i)=>`<div class="g3">
  <input data-mt="${i}" data-f="descripcion" value="${esc(m.descripcion||'')}" placeholder="Descripción">
  <input data-mt="${i}" data-f="unidad" value="${esc(m.unidad||'')}" placeholder="Unid.">
  <input data-mt="${i}" data-f="cantidad" value="${esc(m.cantidad||'')}" placeholder="Cant." inputmode="decimal">
 </div>`).join('')||'<div class="sub" style="margin-bottom:9px">Sin materiales todavía.</div>';
}
function addMat(){ recogerReporte(); REP.materiales.push({descripcion:'',unidad:'',cantidad:''}); pintarMats() }

function recogerReporte(){
 const g=id=>$(id)?$(id).value:undefined;
 if($('rHoraE'))REP.horaEntrada=g('rHoraE')||null;
 if($('rHoraS'))REP.horaSalida=g('rHoraS')||null;
 if($('rAct'))REP.actividad=g('rAct')||null;
 if($('rRec'))REP.recomendaciones=g('rRec')||null;
 if($('rObs'))REP.observaciones=g('rObs')||null;
 if($('rFCNom'))REP.firmaClienteNombre=g('rFCNom')||null;
 if(document.querySelector('[data-eq]')) REP.equipos=[0,1,2].map(i=>{
  const o={rol:ROLES_EQ[i]};
  document.querySelectorAll(`[data-eq="${i}"]`).forEach(el=>o[el.dataset.f]=el.value||'');
  return o});
 document.querySelectorAll('[data-ck]').forEach(el=>{REP.checks[el.dataset.ck]=el.checked});
 document.querySelectorAll('[data-dt]').forEach(el=>{if(el.value)REP.datos[el.dataset.dt]=el.value;else delete REP.datos[el.dataset.dt]});
 document.querySelectorAll('[data-mt]').forEach(el=>{
  const i=+el.dataset.mt; REP.materiales[i]=REP.materiales[i]||{}; REP.materiales[i][el.dataset.f]=el.value});
 REP.materiales=REP.materiales.filter(m=>(m.descripcion||'').trim());
}

/* ---- Firma con el dedo ---- */
function initFirma(cid,key){
 const cv=$(cid); if(!cv) return;
 const r=cv.getBoundingClientRect();
 cv.width=Math.round(r.width*2); cv.height=Math.round(r.height*2);
 const x=cv.getContext('2d'); x.scale(2,2); x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111';
 x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height);
 let d=false,px=0,py=0;
 const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top]};
 const down=e=>{e.preventDefault();d=true;[px,py]=pos(e)};
 const move=e=>{if(!d)return;e.preventDefault();const[a,b]=pos(e);x.beginPath();x.moveTo(px,py);x.lineTo(a,b);x.stroke();px=a;py=b;cv.dataset.dirty='1'};
 const up=()=>{d=false};
 cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);
 window.addEventListener('pointerup',up);cv.addEventListener('pointerleave',up);
}
function limpiarFirma(key){
 const cv=$(key==='cli'?'cvCli':'cvTec'); if(!cv)return;
 const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); cv.dataset.dirty='';
}
function leerFirma(cid){
 const cv=$(cid); if(!cv||!cv.dataset.dirty) return null;
 // Se reduce para que quepa holgada dentro del documento de Firestore.
 const out=document.createElement('canvas'); out.width=520; out.height=170;
 const c=out.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,520,170);
 c.drawImage(cv,0,0,520,170);
 return out.toDataURL('image/png');
}

async function guardarReporte(firmar){
 recogerReporte();
 const m=$('rmsg');
 const fc=leerFirma('cvCli'), ft=leerFirma('cvTec');
 if(ft) REP.firmaTecnico=ft;
 if(firmar){
  if(!fc){ m.className='msg err'; m.textContent='Falta la firma del cliente. Páse le el celular para que firme.'; return }
  if(!(REP.firmaClienteNombre||'').trim()){ m.className='msg err'; m.textContent='Escriba el nombre de quien recibe.'; return }
  REP.firmaCliente=fc;
 }
 REP.firmaTecnicoNombre=(ME&&ME.name)||null;
 m.className='msg ok'; m.textContent='Guardando…';
 try{
  const ref=FB.doc(FB.fs,'tenants',TENANT,'workOrders',REPORD._id,'report','ficha');
  const payload=Object.assign({},REP,{updatedAt:FB.serverTimestamp(),updatedBy:FB.auth.currentUser.uid});
  if(!payload.createdAt){payload.createdAt=FB.serverTimestamp();payload.createdBy=FB.auth.currentUser.uid}
  await FB.setDoc(ref,payload);
  m.className='msg ok';
  m.textContent=firmar?'Reporte firmado y guardado.':'Borrador guardado.';
  if(firmar){ REP.firmaCliente=fc; pintarReporte() }
 }catch(e){
  console.error(e); m.className='msg err'; m.textContent='No se pudo guardar: '+errMsg(e)+(e.code?' ['+e.code+']':'');
 }
}

  return `<tr><td>${esc(it)}</td><td class="v">${esc(fuente[id]!==undefined?(fuente[id]===true?'X':fuente[id]):'')}</td></tr>`}).join('');
}

 $('prBody').innerHTML=`

  <tr><th>Equipo</th><th>Tipo</th><th>Capac.</th><th>Marca</th><th>Modelo</th><th>Serie</th><th>Ubicación</th><th>No.</th></tr>${eq}</table>
 <div class="pconv">${TIPOS_EQ.map(t=>t[0]+': '+t[1]).join(' · ')}</div>
 ${prev?`<div class="pcols">${checksHtml}</div>`:matHtml}

 ${prev?`<table class="pt"><tr><th>Recomendaciones del técnico</th></tr><tr><td class="tall">${esc(REP.recomendaciones||'')}</td></tr>
   <tr><th>Observaciones del cliente</th></tr><tr><td class="tall">${esc(REP.observaciones||'')}</td></tr></table>`:''}

  <div><div class="fbox">${REP.firmaCliente?`<img src="${REP.firmaCliente}">`:''}</div>
   <div class="fl">FIRMA DEL CLIENTE</div><div class="sm">${esc(REP.firmaClienteNombre||'')}</div></div>

  });

  else { TENANT=null;ME=null;ORDERS=[];if(unsub){unsub();unsub=null} $('inBtn').disabled=false; view('vLogin') }

}
if(window.FB) arrancar(); else window.addEventListener('fb-ready',arrancar);
